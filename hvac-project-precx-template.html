<style>
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;min-height:100vh}

/* ── SIDEBAR STANDARD ── */
.sb{width:230px;position:fixed;top:0;left:0;bottom:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:300;transition:width .25s;overflow:hidden;overflow-x:hidden}
.sb.sm{width:52px}
.sb-top{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:9px;overflow:hidden}.sb-icon{font-size:20px;flex-shrink:0}.sb-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--text);white-space:nowrap}
.sb-toggle{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}.sb-toggle:hover{color:var(--accent);border-color:var(--accent)}
.sb-proj-block{padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}.sb-proj-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.sb-proj-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-proj-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:4px}.sb-nav::-webkit-scrollbar-track{background:transparent}.sb-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text2);font-size:13px;border-left:3px solid transparent;position:relative;overflow:hidden;text-decoration:none}.sb-item:hover{background:var(--surface2);color:var(--text)}.sb-item.active{background:var(--accent-dim);color:var(--accent);border-left-color:var(--accent)}
.sb-item-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}.sb-item-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sb-tooltip{position:fixed;background:var(--surface2);color:var(--text);font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.sb-group{}.sb-group-hdr{display:flex;align-items:center;gap:8px;padding:7px 16px 4px;cursor:pointer;user-select:none;transition:background .13s}.sb-group-hdr:hover{background:var(--surface2)}
.sb-group-chev{font-size:10px;color:var(--muted);flex-shrink:0;width:10px}.sb-group-name{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sb-group-items .sb-item{padding-left:28px}
.sb.sm .sb-name,.sb.sm .sb-proj-block,.sb.sm .sb-group-hdr,.sb.sm .sb-item-label,.sb.sm .sb-user-name{display:none}
.sb.sm .sb-group-items{display:block !important}.sb.sm .sb-item{padding:9px 14px;justify-content:center;border-left:none;overflow:visible}
.sb.sm .sb-top{padding:14px 12px 10px;justify-content:center}.sb.sm .sb-footer{justify-content:center}.sb.sm .sb-item-icon{width:auto}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:9px}
.sb-av{width:28px;height:28px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px}.sb-user-name{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-resize-handle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:400;background:transparent}.sb-resize-handle:hover{background:rgba(0,200,255,.15)}

/* MAIN */
.main{margin-left:230px;height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:margin-left .25s}

/* TOPBAR */
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;background:var(--surface)}
.bc{display:flex;align-items:center;gap:7px;font-size:13px;flex:1}
.bcl{color:var(--text2);cursor:pointer}.bcl:hover{color:var(--accent)}.bcs{color:var(--muted)}.bcc{color:var(--text);font-weight:500}
.btn{padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.bp{background:var(--accent);color:#080c12}.bp:hover{background:#33d4ff}
.bg{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.bg:hover{color:var(--text);border-color:var(--text2)}
.bsm{padding:5px 12px;font-size:12px}
.bdanger{background:transparent;color:var(--danger);border:1px solid rgba(255,77,109,.3)}.bdanger:hover{background:var(--danger-dim)}

/* TOOLBAR */
.editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:10px}
.editor-toolbar-actions{display:flex;gap:6px;align-items:center}

/* BODY */
.editor-body{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:18px;max-width:1100px;width:100%;margin:0 auto}
.editor-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:10px;padding:40px;text-align:center}
.editor-empty-icon{font-size:42px;opacity:.5}

/* META */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meta-grid-full{grid-column:1/-1}
.field-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.field-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s;box-sizing:border-box}
.field-input:focus{border-color:var(--accent)}
.field-textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;resize:vertical;min-height:60px;box-sizing:border-box}
.field-textarea:focus{border-color:var(--accent)}
.field-select{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer;box-sizing:border-box}

/* INFO BANNER */
.info-banner{padding:11px 14px;background:var(--accent-dim);border:1px solid rgba(0,200,255,.25);border-radius:8px;color:var(--text2);font-size:12.5px;display:flex;align-items:center;gap:10px}
.info-banner-icon{font-size:16px;flex-shrink:0}

/* SECTIONS */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section-card-hdr{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-card-hdr .field-input{flex:1;background:var(--surface);font-weight:600}
.section-card-hdr .field-select{width:200px;flex-shrink:0;background:var(--surface)}
.section-card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item-row{display:flex;align-items:center;gap:8px}
.item-row .field-input{flex:1}
.act-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;cursor:pointer;transition:all .13s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.act-btn:hover{color:var(--accent);border-color:var(--accent)}
.act-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.act-btn:disabled{opacity:.3;cursor:not-allowed}
.act-btn:disabled:hover{color:var(--text2);border-color:var(--border)}
.section-meta{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.add-item-btn{align-self:flex-start;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:11.5px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .13s;margin-top:4px}
.add-item-btn:hover{color:var(--accent);border-color:var(--accent)}
.add-section-btn{padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--muted);font-family:'DM Mono',monospace;font-size:11.5px;cursor:pointer;text-align:center;transition:all .13s;background:transparent}
.add-section-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.drag-handle{cursor:grab;color:var(--muted);font-size:14px;padding:0 4px;flex-shrink:0;user-select:none}
.drag-handle:active{cursor:grabbing}
.section-card.dragging{opacity:.4}
.section-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* SAVE STATUS */
.save-pill{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.save-pill.dirty{color:var(--warn);border-color:rgba(255,184,48,.3);background:var(--warn-dim)}
.save-pill.saved{color:var(--green);border-color:rgba(0,229,160,.3);background:var(--green-dim)}
</style>

<body>

<!-- SIDEBAR -->
<div id="app-sidebar"></div>
<script src="sidebar.js"></script>

<!-- MAIN -->
<div class="main" id="mainWrap">
  <div class="topbar">
    <div class="bc">
      <span class="bcl" onclick="navTo('hvac-project-settings.html')">Project Settings</span><span class="bcs">›</span>

    <div style="font-size:12px;max-width:380px">Go back to Project Settings → Templates and pull a template from the company library to get started.</div>
    <button class="bp bsm btn" style="margin-top:10px" onclick="window.location.href='hvac-project-settings.html#tab-templates'">← Back to Project Settings</button>
  </div>

  <!-- EDITOR -->

</div>

<script>
// ── DATA ──
var template=null;       // The project's pre-cx template (deep copy of a company template)
var _dirty=false;
var proj={};
var pNum='';

var TRADES=[
  'Mechanical Contractor',
  'Sheet Metal Contractor',
  'Plumber',
  'Electrician',
  'BMS Contractor',
  'Electrician & BMS Contractor',
  'Commissioning Agent',
  'Project Manager',
  'Other'
];

function nid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nowISO(){return new Date().toISOString();}

// ── BOOT ──
(async function(){
  if(typeof dbReady!=='undefined')await dbReady;
  try{proj=JSON.parse(localStorage.getItem('hvacnexus_current_project')||'{}');}catch(e){proj={};}
  pNum=proj.num||'';
  if(!pNum){
    document.getElementById('editorEmpty').style.display='flex';
    document.getElementById('editorTitle').textContent='No project selected';
    return;
  }
  try{
    var t=await dbGetProjectPrecxTemplate(pNum);
    template=(t&&typeof t==='object'&&Array.isArray(t.sections))?t:null;
  }catch(e){console.error(e);template=null;}
  if(!template){
    document.getElementById('editorEmpty').style.display='flex';
    document.getElementById('editorTitle').textContent='No template';
    return;
  }
  document.getElementById('editorBody').style.display='flex';
  renderEditor();
  updateSaveStatus();
})();

// ── EDITOR ──
function renderEditor(){
  if(!template)return;
  document.getElementById('editorTitle').textContent=template.name||'Untitled';
  var body=document.getElementById('editorBody');
  var html='';

  // INFO BANNER about source
  if(template.pulledFrom){
    var pulledDate=template.pulledAt?new Date(template.pulledAt).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'';
    html+='<div class="info-banner">'
      +'<span class="info-banner-icon">ℹ️</span>'
      +'<span>This template was pulled from the company library template <strong>'+escH(template.pulledFrom)+'</strong>'+(pulledDate?' on '+pulledDate:'')+'. Edits here only affect this project.</span>'
    +'</div>';
  }

  // META block
  html+='<div class="meta-grid">'
    +'<div class="meta-grid-full">'
      +'<label class="field-lbl">Template name (project copy)</label>'
      +'<input class="field-input" id="meta-name" value="'+escH(template.name||'')+'" oninput="updateMeta(\'name\',this.value)">'
    +'</div>'
    +'<div class="meta-grid-full">'
      +'<label class="field-lbl">Description (optional)</label>'
      +'<textarea class="field-textarea" id="meta-desc" oninput="updateMeta(\'description\',this.value)" placeholder="Project-specific notes for this checklist">'+escH(template.description||'')+'</textarea>'
    +'</div>'
  +'</div>';

  // SECTIONS
  html+='<div style="display:flex;flex-direction:column;gap:14px" id="sectionsList">';
  (template.sections||[]).forEach(function(sec,sIdx){
    html+=renderSectionCard(sec,sIdx,(template.sections||[]).length);
  });
  html+='</div>';

  // ADD SECTION
  html+='<button class="add-section-btn" onclick="addSection()">＋ Add Section</button>';

  body.innerHTML=html;
}

function renderSectionCard(sec,sIdx,total){
  var tradeOpts=TRADES.map(function(tr){
    return '<option value="'+escH(tr)+'"'+(sec.trade===tr?' selected':'')+'>'+escH(tr)+'</option>';
  }).join('');
  var html='<div class="section-card" data-sec-id="'+sec.id+'" draggable="true" '
    +'ondragstart="secDragStart(event,\''+sec.id+'\')" '
    +'ondragend="secDragEnd(event)" '
    +'ondragover="secDragOver(event)" '
    +'ondragleave="secDragLeave(event)" '
    +'ondrop="secDrop(event,\''+sec.id+'\')">'
    +'<div class="section-card-hdr">'
      +'<span class="drag-handle" title="Drag to reorder">⋮⋮</span>'
      +'<input class="field-input" placeholder="Section title (e.g. General / Documentation)" value="'+escH(sec.title||'')+'" oninput="updateSection(\''+sec.id+'\',\'title\',this.value)">'
      +'<select class="field-select" onchange="updateSection(\''+sec.id+'\',\'trade\',this.value)">'
        +'<option value="">— Sign-off trade —</option>'
        +tradeOpts
      +'</select>'
      +'<div class="section-meta">'
        +'<button class="act-btn" '+(sIdx===0?'disabled':'')+' onclick="moveSection(\''+sec.id+'\',-1)" title="Move up">↑</button>'
        +'<button class="act-btn" '+(sIdx===total-1?'disabled':'')+' onclick="moveSection(\''+sec.id+'\',1)" title="Move down">↓</button>'
        +'<button class="act-btn danger" onclick="deleteSection(\''+sec.id+'\')" title="Delete section">✕</button>'
      +'</div>'
    +'</div>'
    +'<div class="section-card-body">';
  (sec.items||[]).forEach(function(it){
    html+='<div class="item-row">'
      +'<input class="field-input" placeholder="Check item description" value="'+escH(it.desc||'')+'" oninput="updateItem(\''+sec.id+'\',\''+it.id+'\',this.value)">'
      +'<button class="act-btn danger" onclick="deleteItem(\''+sec.id+'\',\''+it.id+'\')" title="Delete item">✕</button>'
    +'</div>';
  });
  html+='<button class="add-item-btn" onclick="addItem(\''+sec.id+'\')">＋ Add Item</button>'
    +'</div>'
  +'</div>';
  return html;
}

// ── EDITS ──
function markDirty(){_dirty=true;updateSaveStatus();}
function updateMeta(field,val){
  if(!template)return;
  template[field]=val;
  if(field==='name')document.getElementById('editorTitle').textContent=val||'Untitled';
  markDirty();
}
function addSection(){
  if(!template)return;
  if(!template.sections)template.sections=[];
  template.sections.push({id:nid(),title:'',trade:'',items:[]});
  markDirty();renderEditor();
}
function updateSection(secId,field,val){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(s){s[field]=val;markDirty();}
}
function deleteSection(secId){
  if(!template)return;
  if(!confirm('Delete this section and all its items?'))return;
  template.sections=(template.sections||[]).filter(function(s){return s.id!==secId;});
  markDirty();renderEditor();
}
function moveSection(secId,delta){
  if(!template||!template.sections)return;
  var i=template.sections.findIndex(function(s){return s.id===secId;});
  if(i<0)return;
  var j=i+delta;
  if(j<0||j>=template.sections.length)return;
  var tmp=template.sections[i];template.sections[i]=template.sections[j];template.sections[j]=tmp;
  markDirty();renderEditor();
}
function addItem(secId){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(!s)return;
  if(!s.items)s.items=[];
  s.items.push({id:nid(),desc:''});
  markDirty();renderEditor();
}
function updateItem(secId,itId,val){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(!s)return;
  var it=(s.items||[]).find(function(x){return x.id===itId;});
  if(it){it.desc=val;markDirty();}
}
function deleteItem(secId,itId){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(!s)return;
  s.items=(s.items||[]).filter(function(x){return x.id!==itId;});
  markDirty();renderEditor();
}

// ── DRAG & DROP ──
var _dragSecId=null;
function secDragStart(e,id){_dragSecId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function secDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.section-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});_dragSecId=null;}
function secDragOver(e){if(!_dragSecId)return;e.preventDefault();e.currentTarget.classList.add('drag-over');e.dataTransfer.dropEffect='move';}
function secDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function secDrop(e,targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!_dragSecId||_dragSecId===targetId)return;
  if(!template||!template.sections)return;
  var fromIdx=template.sections.findIndex(function(s){return s.id===_dragSecId;});
  var toIdx=template.sections.findIndex(function(s){return s.id===targetId;});
  if(fromIdx<0||toIdx<0)return;
  var moved=template.sections.splice(fromIdx,1)[0];
  template.sections.splice(toIdx,0,moved);
  _dragSecId=null;
  markDirty();renderEditor();
}

// ── SAVE ──
async function saveTemplate(){
  if(!template)return;
  if(!(template.name||'').trim()){alert('Please give the template a name before saving.');return;}
  template.savedAt=nowISO();
  await dbSetProjectPrecxTemplate(pNum,template);
  _dirty=false;
  updateSaveStatus();
  showToast('✓ Project template saved');
}

function updateSaveStatus(){
  var el=document.getElementById('saveStatus');
  if(!el)return;
  if(!template){el.textContent='No template';el.className='save-pill';return;}
  if(_dirty){el.textContent='● Unsaved changes';el.className='save-pill dirty';}
  else{el.textContent='✓ All changes saved';el.className='save-pill saved';}
}

window.addEventListener('beforeunload',function(e){
  if(_dirty){e.preventDefault();e.returnValue='';return '';}
});

function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0e1520;border:1px solid #00e5a0;color:#00e5a0;font-family:DM Mono,monospace;font-size:12px;padding:10px 20px;border-radius:8px;z-index:9999;white-space:nowrap;pointer-events:none';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(function(){t.remove();},400);},2200);
}
</script>
</body>
</html>
