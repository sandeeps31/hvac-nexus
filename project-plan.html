<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project plan · HVAC Nexus</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="sidebar.css" />
<style>
/* ═══════════════════════════════════════════════════
   HVAC NEXUS — Project Plan page
   Depends on: theme.css (tokens), sidebar.css (.main wrapper)
   All .pp-* classes are page-specific.
   ═══════════════════════════════════════════════════ */

/* ── Scrollable content container inside .main ── */
.pp-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.pp-scroll::-webkit-scrollbar { width: 8px; }
.pp-scroll::-webkit-scrollbar-track { background: transparent; }
.pp-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Topbar (matches templates page pattern) ── */
.pp-topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
.pp-bc {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  min-width: 0;
}
.pp-bcl {
  color: var(--text2);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pp-bcs { color: var(--muted); flex-shrink: 0; }
.pp-bcc {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pp-topbar-actions {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.pp-btn-danger {
  color: var(--danger);
  border: 1px solid rgba(255,77,109,.3);
  background: transparent;
}
.pp-btn-danger:hover { background: var(--danger-dim); }

/* ── View switching ── */
.pp-view {
  display: none;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  flex-direction: column;
}
.pp-view.active { display: flex; }

/* ── Register view ── */
.pp-reg-toolbar {
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.pp-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface3);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  width: 320px;
}
.pp-search-box:focus-within { border-color: var(--accent); }
.pp-search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  width: 100%;
}
.pp-reg-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}
.pp-archive-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
}
.pp-archive-toggle input { accent-color: var(--accent); }
.pp-reg-page {
  padding: 16px 24px 60px;
  overflow-y: auto;
  flex: 1;
}
.pp-reg-tbl {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pp-reg-tbl thead tr { background: var(--surface2); }
.pp-reg-tbl th {
  padding: 9px 14px;
  text-align: left;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.pp-reg-tbl td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
.pp-reg-tbl tbody tr:last-child td { border-bottom: none; }
.pp-reg-tbl tbody tr:hover td { background: var(--surface2); }
.pp-reg-tbl tbody tr.archived td {
  opacity: 0.55;
  font-style: italic;
}
.pp-plan-name-cell {
  font-weight: 600;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 13.5px;
}
.pp-plan-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}
.pp-count-chip {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text2);
}
.pp-progress-bar {
  height: 6px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
.pp-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width .25s;
}
.pp-progress-pct {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  color: var(--text2);
}
.pp-archived-badge {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  padding: 1px 7px;
  border-radius: 8px;
  background: var(--surface3);
  color: var(--muted);
  border: 1px solid var(--border);
  margin-left: 6px;
  vertical-align: middle;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Action icon buttons (Edit / Duplicate / Delete) */
.pp-act-grid {
  display: grid;
  grid-template-columns: repeat(3, 28px);
  gap: 4px;
  justify-content: flex-end;
}
.pp-act-btn {
  width: 28px;
  height: 28px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: all .13s;
  position: relative;
}
.pp-act-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
.pp-act-btn.danger:hover {
  border-color: var(--danger);
  color: var(--danger);
  background: var(--danger-dim);
}
.pp-act-btn.warn:hover {
  border-color: var(--warn);
  color: var(--warn);
  background: var(--warn-dim);
}
.pp-act-btn .pp-tip {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  color: var(--text);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 500;
}
.pp-act-btn:hover .pp-tip { opacity: 1; }

/* Empty state for register */
.pp-reg-empty {
  text-align: center;
  padding: 60px 30px;
  color: var(--muted);
}
.pp-reg-empty-icon { font-size: 42px; opacity: 0.3; margin-bottom: 14px; }
.pp-reg-empty-title { font-family: 'Syne', sans-serif; font-size: 15px; color: var(--text2); margin-bottom: 8px; }
.pp-reg-empty-sub { font-size: 13px; max-width: 360px; margin: 0 auto 16px; line-height: 1.5; }
.pp-reg-empty-actions { display: flex; gap: 8px; justify-content: center; }

/* ── Buttons ── */
.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  transition: all .13s;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.btn.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover {
  background: #00b3e6;
  border-color: #00b3e6;
  color: var(--bg);
}
.btn.danger {
  color: var(--danger);
}
.btn.danger:hover {
  border-color: var(--danger);
  background: var(--danger-dim);
}

/* ── Stats strip ── */
.pp-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 14px 22px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.pp-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
}
.pp-stat-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.pp-stat-val {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
}
.pp-stat.done .pp-stat-val { color: var(--green); }
.pp-stat.prog .pp-stat-val { color: var(--accent); }
.pp-stat.overdue .pp-stat-val { color: var(--danger); }

/* ── Phase tabs ── */
.pp-tabs {
  display: flex;
  gap: 0;
  padding: 0 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: scroll;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--accent) var(--surface2);
}
.pp-tabs::-webkit-scrollbar {
  height: 8px;
  display: block;
}
.pp-tabs::-webkit-scrollbar-track {
  background: var(--surface2);
}
.pp-tabs::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
.pp-tabs::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}
.pp-tab {
  padding: 9px 18px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  transition: color .13s;
}
.pp-tab > div { min-width: 0; }
.pp-tab:hover { color: var(--text); }
.pp-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.pp-tab-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  background: var(--surface2);
  padding: 1px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}
.pp-tab.active .pp-tab-count {
  color: var(--accent);
  background: var(--accent-dim);
}

/* ── Filters bar ── */
.pp-filters {
  display: flex;
  gap: 8px;
  padding: 12px 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex-shrink: 0;
}
.pp-filters input,
.pp-filters select {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text);
}
.pp-filters input { flex: 1; min-width: 200px; }
.pp-filters input::placeholder { color: var(--muted); }
.pp-filters input:focus,
.pp-filters select:focus {
  outline: none;
  border-color: var(--accent);
}

/* ── Stage groups ── */
.pp-content { padding: 14px 22px 60px; }
/* ── Stage card (matches templates page tset) ── */
.pp-stage {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 14px;
  transition: box-shadow .15s;
}
.pp-stage-hdr {
  padding: 11px 16px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.pp-stage-num {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
  min-width: 36px;
}
.pp-stage-name {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  min-width: 0;
}
.pp-stage-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.pp-progbar {
  height: 6px;
  width: 100px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: hidden;
}
.pp-progbar-fill {
  height: 100%;
  background: var(--green);
  transition: width .25s;
}
.pp-progbar-pct {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  color: var(--text2);
  white-space: nowrap;
  min-width: 60px;
  text-align: right;
}
.pp-stage-collapse {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 6px;
  flex-shrink: 0;
}
.pp-stage-collapse:hover { color: var(--accent); }
.pp-stage-menu {
  color: var(--muted);
  cursor: pointer;
  padding: 2px 8px;
  font-size: 16px;
  border-radius: 4px;
  user-select: none;
  flex-shrink: 0;
}
.pp-stage-menu:hover {
  background: var(--surface3);
  color: var(--text);
}
.pp-stage-body { overflow: hidden; }
.pp-stage-body.collapsed { display: none; }

/* ── Items table ── */
.pp-rows-tbl {
  width: 100%;
  border-collapse: collapse;
}
.pp-rows-tbl th {
  padding: 8px 12px;
  text-align: left;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.pp-rows-tbl td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 13px;
}
.pp-rows-tbl tr:last-child td { border-bottom: none; }
.pp-rows-tbl tbody tr:hover td { background: var(--surface2); }
.pp-rows-tbl tr.pp-row-overdue td { background: rgba(255, 77, 109, 0.04); }
.pp-rows-tbl tr.pp-row-overdue:hover td { background: rgba(255, 77, 109, 0.08); }

.pp-step-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  width: 36px;
}
.pp-step-input {
  background: var(--surface3);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  padding: 5px 8px;
  outline: none;
  width: 100%;
  transition: border-color .2s;
  box-sizing: border-box;
}
.pp-step-input:focus { border-color: var(--accent); background: var(--surface2); }
.pp-step-input::placeholder { color: var(--muted); }

/* Assignee select */
.pp-assignee-sel {
  background: var(--surface3);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
  width: 100%;
  cursor: pointer;
  transition: border-color .15s;
  box-sizing: border-box;
}
.pp-assignee-sel:hover { border-color: var(--muted); }
.pp-assignee-sel:focus { border-color: var(--accent); }
.pp-assignee-sel.has-assignee { color: var(--text); }

/* Notes icon (same as templates page) */
.pp-notes-icon {
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 5px;
  border: 1.5px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .13s;
  background: transparent;
}
.pp-notes-icon:hover {
  border-color: var(--muted);
  background: var(--surface3);
}
.pp-notes-icon.has-notes {
  background: rgba(0,229,160,.18);
  border-color: var(--green);
  box-shadow: 0 0 0 2px rgba(0,229,160,.08);
}
.pp-notes-icon.has-notes:hover { background: rgba(0,229,160,.28); }

/* Status: Yes / No / N/A radio group */
.pp-status-grp {
  display: inline-flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface3);
}
.pp-status-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 5px 10px;
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.5px;
  font-weight: 600;
  border-right: 1px solid var(--border);
  transition: all .12s;
  min-width: 36px;
}
.pp-status-btn:last-child { border-right: none; }
.pp-status-btn:hover { background: var(--surface2); color: var(--text); }
.pp-status-btn.active.pp-st-yes {
  background: var(--green-dim);
  color: var(--green);
  box-shadow: inset 0 0 0 1.5px var(--green);
}
.pp-status-btn.active.pp-st-no {
  background: var(--danger-dim);
  color: var(--danger);
  box-shadow: inset 0 0 0 1.5px var(--danger);
}
.pp-status-btn.active.pp-st-na {
  background: var(--surface2);
  color: var(--text2);
  box-shadow: inset 0 0 0 1.5px var(--text2);
}

/* Edit drawer trigger + delete */
.pp-row-edit-btn, .pp-row-del {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  width: 26px;
  height: 26px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all .13s;
}
.pp-row-edit-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
.pp-row-del:hover {
  border-color: var(--danger);
  color: var(--danger);
  background: var(--danger-dim);
}

/* Drag handle */
.pp-drag-handle {
  color: var(--muted);
  cursor: grab;
  padding: 0 6px;
  font-size: 16px;
  user-select: none;
  flex-shrink: 0;
  line-height: 1;
}
.pp-drag-handle:active { cursor: grabbing; }

/* Add item button at bottom of each stage */
.pp-add-item-btn {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 9px 14px;
  color: var(--muted);
  font-size: 12.5px;
  cursor: pointer;
  background: none;
  border: none;
  border-top: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  width: 100%;
  text-align: left;
  transition: color .13s;
}
.pp-add-item-btn:hover { color: var(--accent); background: var(--accent-dim); }

/* Add stage button */
.pp-add-stage-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 16px;
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  background: var(--accent-dim);
  border: 1px dashed rgba(0,200,255,.3);
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  width: 100%;
  margin-top: 14px;
  transition: background .13s;
}
.pp-add-stage-btn:hover { background: rgba(0,200,255,.15); }

/* Phase tab progress (small bar under count) */
.pp-tab-progress {
  width: 60px;
  height: 3px;
  background: var(--surface3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.pp-tab-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width .2s;
}

/* ── Sub-items (live-mode rows nested under parent) ── */
.pp-subitem-row td {
  background: var(--bg) !important;
  border-bottom: 1px solid var(--border);
}
.pp-sub-bullet {
  color: var(--muted);
  font-size: 13px;
  padding-left: 8px;
  flex-shrink: 0;
}
.pp-sub-desc {
  color: var(--text2);
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.pp-sub-desc-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pp-sub-desc-wrap .pp-step-input {
  font-size: 12.5px;
  color: var(--text2);
}
.pp-sub-strike {
  text-decoration: line-through;
  color: var(--muted) !important;
}

/* ── Empty state ── */
.pp-empty {
  text-align: center;
  padding: 80px 24px;
  color: var(--text2);
}
.pp-empty .pp-empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.6;
}
.pp-empty .pp-empty-title {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.pp-empty .pp-empty-sub {
  color: var(--text2);
  margin-bottom: 20px;
  font-size: 13px;
}
.pp-empty .btn { margin: 0 4px; }
.pp-empty-stage {
  padding: 18px;
  text-align: center;
  color: var(--muted);

  <script>
// ── HVAC Nexus — Project Plan (live project plans) ──
//
// Templates are managed on a separate page (project-plan-templates.html).
// This page handles only live plans for a project. The "Apply template" button
// reads templates from the same Supabase table (project_plan_templates) and
// clones a template into a new live plan.

let PP_PLANS = [];
let PP_TEMPLATES = [];
let PP_CURRENT_PLAN_ID = null;
let PP_CURRENT_PHASE_ID = null;
let PP_PROJECT_NUM = null;
let PP_USERS = [];
let PP_SEARCH = '';
let PP_FILTER_STATUS = 'all';
let PP_FILTER_ASSIGNEE = 'all';
let PP_SHOW_ARCHIVED = false;

const PP_DEFAULT_PHASES = [
  { name: 'Initiation & planning', stages: ['01 Initiation', '02 Dilapidation', '03 Planning'] },
  { name: 'Construction', stages: ['Setup', 'Isolation', 'Demolition', 'Rigging', 'Rough in'] },
  { name: 'Commissioning', stages: ['01 Commissioning documentation', '02 Pre-commissioning', '03 Commissioning'] },
  { name: 'Handover', stages: ['Asset register', 'O&M manuals', 'Training'] }
];

const STATUS_LABELS = {
  to_do:        { label: '— Not set —',  cls: 'pp-st-todo' },
  in_progress:  { label: 'In progress',  cls: 'pp-st-prog' },
  done:         { label: 'Yes',          cls: 'pp-st-done' },
  no:           { label: 'No',           cls: 'pp-st-no'   },
  not_required: { label: 'N/A',          cls: 'pp-st-nr'   },
  blocked:      { label: 'Blocked',      cls: 'pp-st-blk'  }
};

// ─── Utilities ─────────────────────────────────────────────
function ppUid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function ppEsc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ppToday() { return new Date().toISOString().slice(0, 10); }
function ppCurrentPlan() { return PP_PLANS.find(p => p.id === PP_CURRENT_PLAN_ID) || null; }
function ppCurrentPhase() {
  const plan = ppCurrentPlan();
  if (!plan) return null;
  return plan.phases.find(ph => ph.id === PP_CURRENT_PHASE_ID) || plan.phases[0] || null;
}
function ppFindItem(itemId) {
  const plan = ppCurrentPlan();
  if (!plan) return null;
  for (const ph of plan.phases) {
    for (const st of ph.stages) {
      const it = st.items.find(i => i.id === itemId);
      if (it) return { item: it, stage: st, phase: ph };
    }
  }
  return null;
}
function ppFindSubItem(itemId, subId) {
  const r = ppFindItem(itemId);
  if (!r || !r.item.subs) return null;
  const sub = r.item.subs.find(s => s.id === subId);
  return sub ? Object.assign({}, r, { sub }) : null;
}
function ppCurrentUserName() {
  try {
    const u = dbGetCurrentUser();
    if (u && u.name) return u.name;
    if (u && u.email) return u.email;
  } catch(e) {}
  try {
    const sess = JSON.parse(localStorage.getItem('hvacnexus_session') || '{}');
    return sess.user && (sess.user.user_metadata && sess.user.user_metadata.name || sess.user.email) || 'Unknown';
  } catch(e) {}
  return 'Unknown';
}
function ppIsOverdue(item) {
  if (!item.dueDate) return false;
  if (item.status === 'done' || item.status === 'not_required') return false;
  return item.dueDate < ppToday();
}

// ─── Init ──────────────────────────────────────────────────
async function ppInit() {
  const proj = dbGetCurrentProject();
  if (!proj || !proj.num) {
    document.getElementById('pp-reg-body').innerHTML = '<tr><td colspan="7"><div class="pp-reg-empty"><div class="pp-reg-empty-title">No project selected</div><div class="pp-reg-empty-sub"><a href="index.html">Choose a project</a> first.</div></div></td></tr>';
    return;
  }
  PP_PROJECT_NUM = proj.num;

  const tagEl = document.getElementById('pp-proj-tag');
  if (tagEl) tagEl.textContent = 'Project · ' + proj.num + ' ' + (proj.name || '');

  const [plans, users, tpls] = await Promise.all([
    dbGetProjectPlans(PP_PROJECT_NUM),
    dbGetUsers(),
    dbGetProjectPlanTemplates()
  ]);
  PP_PLANS = Array.isArray(plans) ? plans : [];
  PP_USERS = Array.isArray(users) ? users : [];
  PP_TEMPLATES = Array.isArray(tpls) ? tpls : [];

  // Always start in register view
  ppShowRegister();
}

// ─── View switching ────────────────────────────────────────
function ppShowRegister() {
  PP_CURRENT_PLAN_ID = null;
  PP_CURRENT_PHASE_ID = null;
  document.getElementById('pp-view-register').classList.add('active');
  document.getElementById('pp-view-editor').classList.remove('active');
  document.getElementById('pp-reg-actions').style.display = 'flex';
  document.getElementById('pp-edit-actions').style.display = 'none';
  document.getElementById('pp-bc-curr').textContent = 'Project Plans';
  ppRenderRegister();
}

function ppOpenPlan(planId) {
  const plan = PP_PLANS.find(p => p.id === planId);
  if (!plan) { ppShowRegister(); return; }
  PP_CURRENT_PLAN_ID = planId;
  PP_CURRENT_PHASE_ID = plan.phases.length ? plan.phases[0].id : null;
  document.getElementById('pp-view-register').classList.remove('active');
  document.getElementById('pp-view-editor').classList.add('active');
  document.getElementById('pp-reg-actions').style.display = 'none';
  document.getElementById('pp-edit-actions').style.display = 'flex';
  document.getElementById('pp-bc-curr').textContent = plan.name + (plan.archived ? ' (archived)' : '');
  // Toggle archive vs restore button
  document.getElementById('pp-archive-btn').style.display = plan.archived ? 'none' : '';
  document.getElementById('pp-restore-btn').style.display = plan.archived ? '' : 'none';
  ppRender();
}

// ─── REGISTER ──────────────────────────────────────────────
function ppRenderRegister() {
  const q = (document.getElementById('pp-reg-search').value || '').toLowerCase();
  const list = PP_PLANS
    .filter(p => PP_SHOW_ARCHIVED || !p.archived)
    .filter(p => !q || (p.name || '').toLowerCase().includes(q));

  const cnt = document.getElementById('pp-reg-count');
  if (cnt) cnt.textContent = list.length + ' plan' + (list.length !== 1 ? 's' : '');

  const body = document.getElementById('pp-reg-body');
  if (!body) return;

  if (!PP_PLANS.length || !PP_PLANS.some(p => PP_SHOW_ARCHIVED || !p.archived)) {
    body.innerHTML = `
      <tr><td colspan="7">
        <div class="pp-reg-empty">
          <div class="pp-reg-empty-icon">📅</div>
          <div class="pp-reg-empty-title">No plans yet for this project</div>
          <div class="pp-reg-empty-sub">Create your first plan to get started. You can apply a company template or import from Excel once the plan is open.</div>
          <div class="pp-reg-empty-actions">
            <button class="btn primary" onclick="ppNewPlan()">+ New plan</button>
          </div>
        </div>
      </td></tr>`;
    return;
  }
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="7"><div class="pp-reg-empty"><div class="pp-reg-empty-sub">No plans match "${ppEsc(q)}".</div></div></td></tr>`;
    return;
  }

  let html = '';
  for (const p of list) {
    const stageCount = p.phases.reduce((a, ph) => a + ph.stages.length, 0);
    const stats = ppPlanStats(p);
    const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
    const archived = p.archived;
    html += `
      <tr class="${archived ? 'archived' : ''}" style="cursor:pointer" onclick="ppOpenPlan('${p.id}')">
        <td>
          <div class="pp-plan-name-cell">${ppEsc(p.name)}${archived ? '<span class="pp-archived-badge">archived</span>' : ''}</div>
          <div class="pp-plan-meta">Created ${ppFmtDate(p.createdAt)}</div>
        </td>
        <td><span class="pp-count-chip">${p.phases.length}</span></td>
        <td><span class="pp-count-chip">${stageCount}</span></td>
        <td><span class="pp-count-chip">${stats.total}</span></td>
        <td>
          <div class="pp-progress-pct">${pct}% &middot; ${stats.done}/${stats.total}</div>
          <div class="pp-progress-bar"><div class="pp-progress-fill" style="width:${pct}%"></div></div>
        </td>
        <td style="color:var(--text2);font-size:12px">${ppFmtDate(p.updatedAt || p.createdAt)}</td>
        <td onclick="event.stopPropagation()">
          <div class="pp-act-grid">
            <button class="pp-act-btn" onclick="ppOpenPlan('${p.id}')" title="Edit"><span class="pp-tip">Edit</span>✎</button>
            <button class="pp-act-btn warn" onclick="ppDuplicatePlanFromReg('${p.id}')" title="Duplicate"><span class="pp-tip">Duplicate</span>⎘</button>
            ${archived
              ? `<button class="pp-act-btn" onclick="ppRestorePlanFromReg('${p.id}')" title="Restore"><span class="pp-tip">Restore</span>↺</button>`
              : `<button class="pp-act-btn danger" onclick="ppArchivePlanFromReg('${p.id}')" title="Delete"><span class="pp-tip">Delete</span>🗑</button>`}
          </div>
        </td>
      </tr>`;
  }
  body.innerHTML = html;
}

function ppToggleArchivedReg(checked) {
  PP_SHOW_ARCHIVED = !!checked;
  ppRenderRegister();
}

function ppDuplicatePlanFromReg(planId) {
  const src = PP_PLANS.find(p => p.id === planId);
  if (!src) return;
  const newName = prompt('Name for the duplicated plan:', src.name + ' (copy)');
  if (!newName || !newName.trim()) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = ppUid('pp');
  copy.name = newName.trim();
  copy.createdAt = ppToday();
  copy.archived = false;
  delete copy.updatedAt;
  copy.phases.forEach(ph => {
    ph.id = ppUid('ph');
    ph.stages.forEach(st => {
      st.id = ppUid('st');
      st.items.forEach(it => {
        it.id = ppUid('it');
        if (it.subs) it.subs.forEach(s => s.id = ppUid('sub'));
      });
    });
  });
  PP_PLANS.push(copy);
  ppSave();
  ppRenderRegister();
}

function ppArchivePlanFromReg(planId) {
  const p = PP_PLANS.find(x => x.id === planId);
  if (!p) return;
  if (!confirm(`Archive plan "${p.name}"?\n\nThe plan will be hidden but retained for audit. Toggle "Show archived" to restore it later.`)) return;
  p.archived = true;
  p.updatedAt = ppToday();
  ppSave();
  ppRenderRegister();
}

function ppRestorePlanFromReg(planId) {
  const p = PP_PLANS.find(x => x.id === planId);
  if (!p) return;
  p.archived = false;
  p.updatedAt = ppToday();
  ppSave();
  ppRenderRegister();
}

// ─── Render (editor view) ──────────────────────────────────
function ppRender() {
  const plan = ppCurrentPlan();
  if (!plan) { ppShowRegister(); return; }

  // Stats
  const stats = ppPlanStats(plan);
  const setEl = (id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  setEl('pp-stat-total', stats.total);
  setEl('pp-stat-done', stats.done);
  setEl('pp-stat-prog', stats.inProgress);
  setEl('pp-stat-overdue', stats.overdue);

  // Phase tabs
  const phaseTabs = plan.phases.map(ph => {
    const active = ph.id === PP_CURRENT_PHASE_ID;
    const phStats = ppPhaseStats(ph);
    const pct = phStats.total ? Math.round((phStats.done / phStats.total) * 100) : 0;
    return `<div class="pp-tab ${active ? 'active' : ''}" onclick="ppSelectPhase('${ph.id}')">
      <div>
        <div>${ppEsc(ph.name)}</div>
        <div class="pp-tab-progress"><div class="pp-tab-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <span class="pp-tab-count">${phStats.done}/${phStats.total}</span>
    </div>`;
  }).join('');
  const tabsEl = document.getElementById('pp-phase-tabs');
  if (tabsEl) tabsEl.innerHTML = phaseTabs;

  // Assignee filter
  const assigneeOpts = ['<option value="all">All assignees</option>',
    '<option value="unassigned">— Unassigned —</option>'].concat(
    PP_USERS.map(u => '<option value="' + ppEsc(u.email || u.id) + '"' +
      (PP_FILTER_ASSIGNEE === (u.email || u.id) ? ' selected' : '') + '>' +
      ppEsc(u.name || u.email) + '</option>')
  ).join('');
  const fa = document.getElementById('pp-filter-assignee');
  if (fa) fa.innerHTML = assigneeOpts;

  const phase = ppCurrentPhase();
  if (!phase) {
    document.getElementById('pp-content').innerHTML = '<div class="pp-empty">No phase selected.</div>';
    return;
  }

  let html = '';
  phase.stages.forEach((stage, i) => { html += ppRenderStage(stage, i); });
  if (!phase.stages.length) {
    html = `<div class="pp-empty"><div class="pp-empty-sub">No stages in this phase yet.</div><button class="btn primary" onclick="ppAddStage()">+ Add stage</button></div>`;
  } else {
    html += `<button class="pp-add-stage-btn" onclick="ppAddStage()">＋ Add stage</button>`;
  }
  document.getElementById('pp-content').innerHTML = html;
}

function ppRenderStage(stage, stageIdx) {
  const stats = ppStageStats(stage);
  const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
  const stageNum = String(stageIdx + 1).padStart(2, '0');

  const filtered = stage.items.filter(it => ppItemMatchesFilters(it));

  let bodyHtml;
  if (!stage.items.length) {
    bodyHtml = `<div class="pp-empty-stage">No items yet. Click + Add item below to start.</div>`;
  } else if (!filtered.length) {
    bodyHtml = `<div class="pp-empty-stage">No items match the current filters.</div>`;
  } else {
    let rowsHtml = '';
    for (const it of filtered) rowsHtml += ppRenderItem(it, stage.id);
    bodyHtml = `
      <table class="pp-rows-tbl">
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Description</th>
            <th style="width:160px">Assigned To</th>
            <th style="width:50px;text-align:center">Notes</th>
            <th style="width:140px;text-align:center">Status</th>
            <th style="width:30px"></th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
  }

  return `
    <div class="pp-stage" data-stage="${stage.id}">
      <div class="pp-stage-hdr">
        <span class="pp-stage-num">${stageNum}</span>
        <span class="pp-stage-name">${ppEsc(stage.name)}</span>
        <div class="pp-stage-progress">
          <div class="pp-progbar"><div class="pp-progbar-fill" style="width:${pct}%;"></div></div>
          <span class="pp-progbar-pct">${pct}% &middot; ${stats.done}/${stats.total}</span>
        </div>
        <button class="pp-stage-collapse" id="chev-${stage.id}" onclick="ppToggleStage('${stage.id}')" title="Collapse">▾</button>
        <span class="pp-stage-menu" onclick="event.stopPropagation(); ppStageMenu('${stage.id}', event)">⋯</span>
      </div>
      <div class="pp-stage-body" id="items-${stage.id}">
        ${bodyHtml}
        <button class="pp-add-item-btn" onclick="ppAddItem('${stage.id}')">＋ Add item</button>
      </div>
    </div>`;
}

function ppRenderItem(item, stageId) {
  const overdue = ppIsOverdue(item);
  const userName = ppLookupUserName(item.assignedTo);
  const status = item.status || 'to_do';
  const isYes = status === 'done';
  const isNo  = status === 'no';
  const isNA  = status === 'not_required';
  const hasNotes = !!((item.notes && item.notes.trim()) || (item.comment && item.comment.trim()));

  // Build assignee dropdown
  let assigneeOpts = '<option value="">— Unassigned —</option>';
  for (const u of PP_USERS) {
    const v = u.email || u.id;
    const sel = (item.assignedTo === u.email || item.assignedTo === u.id) ? ' selected' : '';
    assigneeOpts += '<option value="' + ppEsc(v) + '"' + sel + '>' + ppEsc(u.name || u.email) + '</option>';
  }
  const hasAssignee = !!item.assignedTo;

  // Find item index in stage
  const stage = ppCurrentPhase().stages.find(s => s.id === stageId);
  const idx = stage ? stage.items.findIndex(x => x.id === item.id) + 1 : 0;

  let html = `
    <tr class="${overdue ? 'pp-row-overdue' : ''}" data-item="${item.id}">
      <td class="pp-step-num">${idx}</td>
      <td>
        <input class="pp-step-input" value="${ppEsc(item.description)}" placeholder="Item description…"
          onchange="ppUpdateItemDesc('${item.id}', this.value)" />
      </td>
      <td>
        <select class="pp-assignee-sel ${hasAssignee?'has-assignee':''}" onchange="ppUpdateItemAssignee('${item.id}', this.value)">
          ${assigneeOpts}
        </select>
      </td>
      <td style="text-align:center">
        <button class="pp-notes-icon ${hasNotes?'has-notes':''}" onclick="ppOpenNotesDrawer('${item.id}')" title="${hasNotes?'Edit notes':'Add notes'}">📝</button>
      </td>
      <td style="text-align:center">
        <div class="pp-status-grp" role="group" aria-label="Status">
          <button class="pp-status-btn pp-st-yes ${isYes?'active':''}" onclick="ppSetItemStatus('${item.id}','done')" title="Yes">YES</button>
          <button class="pp-status-btn pp-st-no  ${isNo?'active':''}"  onclick="ppSetItemStatus('${item.id}','no')" title="No">NO</button>
          <button class="pp-status-btn pp-st-na  ${isNA?'active':''}"  onclick="ppSetItemStatus('${item.id}','not_required')" title="Not Applicable">N/A</button>
        </div>
      </td>
      <td>
        <button class="pp-row-del" onclick="ppDeleteItem('${item.id}')" title="Delete">✕</button>
      </td>
    </tr>`;

  if (item.subs && item.subs.length) {
    for (const sub of item.subs) html += ppRenderSubItem(sub, item.id);
  }
  return html;
}

function ppRenderSubItem(sub, parentId) {
  const status = sub.status || 'to_do';
  const isYes = status === 'done';
  const isNo  = status === 'no';
  const isNA  = status === 'not_required';
  const isSettled = isYes || isNA;   // strikethrough when item is in a "settled" state
  const hasNotes = !!(sub.notes && sub.notes.trim());

  let assigneeOpts = '<option value="">— Unassigned —</option>';
  for (const u of PP_USERS) {
    const v = u.email || u.id;
    const sel = (sub.assignedTo === u.email || sub.assignedTo === u.id) ? ' selected' : '';
    assigneeOpts += '<option value="' + ppEsc(v) + '"' + sel + '>' + ppEsc(u.name || u.email) + '</option>';
  }

  return `
    <tr class="pp-subitem-row">
      <td></td>
      <td>
        <div class="pp-sub-desc-wrap">
          <span class="pp-sub-bullet">↳</span>
          <input class="pp-step-input ${isSettled?'pp-sub-strike':''}" value="${ppEsc(sub.description||'')}" placeholder="Sub-item description…"
            onchange="ppUpdateSubDesc('${parentId}','${sub.id}', this.value)" />
        </div>
      </td>
      <td>
        <select class="pp-assignee-sel ${sub.assignedTo?'has-assignee':''}" onchange="ppUpdateSubAssignee('${parentId}','${sub.id}',this.value)">
          ${assigneeOpts}
        </select>
      </td>
      <td style="text-align:center">
        <button class="pp-notes-icon ${hasNotes?'has-notes':''}" onclick="ppOpenSubNotesDrawer('${parentId}','${sub.id}')" title="${hasNotes?'Edit notes':'Add notes'}">📝</button>
      </td>
      <td style="text-align:center">
        <div class="pp-status-grp" role="group" aria-label="Status">
          <button class="pp-status-btn pp-st-yes ${isYes?'active':''}" onclick="ppSetSubStatus('${parentId}','${sub.id}','done')" title="Yes">YES</button>
          <button class="pp-status-btn pp-st-no  ${isNo?'active':''}"  onclick="ppSetSubStatus('${parentId}','${sub.id}','no')" title="No">NO</button>
          <button class="pp-status-btn pp-st-na  ${isNA?'active':''}"  onclick="ppSetSubStatus('${parentId}','${sub.id}','not_required')" title="Not Applicable">N/A</button>
        </div>
      </td>
      <td>
        <button class="pp-row-del" onclick="ppDeleteSubItem('${parentId}','${sub.id}')" title="Delete sub-item">✕</button>
      </td>
    </tr>`;
}

function ppLookupUserName(emailOrId) {
  if (!emailOrId) return '— Unassigned —';
  const u = PP_USERS.find(x => x.email === emailOrId || x.id === emailOrId);
  return u ? (u.name || u.email) : emailOrId;
}
function ppFmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch(e) { return iso; }
}

// ─── Stats ─────────────────────────────────────────────────
function ppPlanStats(plan) {
  let total = 0, done = 0, inProgress = 0, overdue = 0;
  for (const ph of plan.phases) {
    for (const st of ph.stages) {
      for (const it of st.items) {
        total++;
        // "done" toward progress = Yes OR N/A (any settled state)
        if (it.status === 'done' || it.status === 'not_required') done++;
        else if (it.status === 'in_progress') inProgress++;
        if (ppIsOverdue(it)) overdue++;
        if (it.subs) for (const s of it.subs) {
          total++;
          if (s.status === 'done' || s.status === 'not_required') done++;
        }
      }
    }
  }
  return { total, done, inProgress, overdue };
}
function ppPhaseStats(phase) {
  let total = 0, done = 0;
  for (const st of phase.stages) {
    for (const it of st.items) {
      total++;
      if (it.status === 'done' || it.status === 'not_required') done++;
      if (it.subs) for (const s of it.subs) {
        total++;
        if (s.status === 'done' || s.status === 'not_required') done++;
      }
    }
  }
  return { total, done };
}
function ppStageStats(stage) {
  let total = 0, done = 0;
  for (const it of stage.items) {
    total++;
    if (it.status === 'done' || it.status === 'not_required') done++;
    if (it.subs) for (const s of it.subs) {
      total++;
      if (s.status === 'done' || s.status === 'not_required') done++;
    }
  }
  return { total, done };
}

// ─── Filters ───────────────────────────────────────────────
function ppItemMatchesFilters(item) {
  if (PP_SEARCH) {
    const matchSelf = (item.description || '').toLowerCase().includes(PP_SEARCH);
    const matchSub = item.subs && item.subs.some(s => (s.description||'').toLowerCase().includes(PP_SEARCH));
    if (!matchSelf && !matchSub) return false;
  }
  if (PP_FILTER_STATUS !== 'all') {
    if (PP_FILTER_STATUS === 'overdue') { if (!ppIsOverdue(item)) return false; }
    else if (item.status !== PP_FILTER_STATUS) return false;
  }
  if (PP_FILTER_ASSIGNEE !== 'all') {
    if (PP_FILTER_ASSIGNEE === 'unassigned') { if (item.assignedTo) return false; }
    else if (item.assignedTo !== PP_FILTER_ASSIGNEE) return false;
  }
  return true;
}
function ppOnSearch(v) { PP_SEARCH = (v || '').toLowerCase().trim(); ppRender(); }
function ppOnFilterStatus(v) { PP_FILTER_STATUS = v; ppRender(); }
function ppOnFilterAssignee(v) { PP_FILTER_ASSIGNEE = v; ppRender(); }

// ─── Plan management ───────────────────────────────────────
function ppOnPlanChange(v) {
  PP_CURRENT_PLAN_ID = v;
  const plan = ppCurrentPlan();
  PP_CURRENT_PHASE_ID = plan && plan.phases.length ? plan.phases[0].id : null;
  ppRender();
}

function ppNewPlan() {
  const name = prompt('Plan name (e.g. "Main works", "Plant room", "L3 fitout"):');
  if (!name || !name.trim()) return;
  const plan = ppBlankPlan(name.trim());
  PP_PLANS.push(plan);
  ppSave();
  ppOpenPlan(plan.id);
}

function ppBlankPlan(name) {
  return {
    id: ppUid('pp'),
    name: name,
    templateId: null,
    createdAt: ppToday(),
    archived: false,
    phases: PP_DEFAULT_PHASES.map(p => ({
      id: ppUid('ph'),
      name: p.name,
      stages: p.stages.map(s => ({ id: ppUid('st'), name: s, items: [] }))
    }))
  };
}

// ─── Apply template ────────────────────────────────────────
function ppApplyTemplatePicker(ev) {
  if (ev) ev.stopPropagation();
  ppCloseAnyMenu();
  if (!PP_TEMPLATES.length) {
    alert('No company templates exist yet.\n\nCreate one in: Company settings → Templates → Project Plan.');
    return;
  }
  const menu = document.createElement('div');
  menu.className = 'pp-popmenu';
  menu.style.maxHeight = '320px';
  menu.style.overflowY = 'auto';
  menu.style.minWidth = '260px';
  let html = '<div class="pp-popitem" style="font-family:\'DM Mono\',monospace;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:default;pointer-events:none">Apply template</div>';
  for (const t of PP_TEMPLATES) {
    const stats = ppPlanStats(t);
    html += `<div class="pp-popitem" onclick="ppApplyTemplate('${t.id}')">
      <div>${ppEsc(t.name)}</div>
      <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px">${stats.total} items · ${t.phases.reduce((a,p)=>a+p.stages.length,0)} stages</div>
    </div>`;
  }
  menu.innerHTML = html;
  document.body.appendChild(menu);
  if (ev && ev.clientX) {
    ppPositionMenu(menu, ev);
  } else {
    menu.style.left = '50%';
    menu.style.top = '120px';
    menu.style.transform = 'translateX(-50%)';
    setTimeout(() => document.addEventListener('click', ppCloseAnyMenu, { once: true }), 0);
  }
}

function ppApplyTemplate(tplId) {
  ppCloseAnyMenu();
  const tpl = PP_TEMPLATES.find(t => t.id === tplId);
  if (!tpl) return;
  const plan = ppCurrentPlan();
  if (!plan) { alert('No plan is open. Apply a template from inside an open plan.'); return; }

  // Warn about overwrite
  const stats = ppPlanStats(plan);
  const hasContent = stats.total > 0;
  if (hasContent) {
    const msg = `Replace this plan's contents with template "${tpl.name}"?\n\n`
              + `This will delete all ${stats.total} item${stats.total===1?'':'s'} `
              + `(including ${stats.done} marked done) in "${plan.name}" and replace them with the template's structure.\n\n`
              + `The plan name and creation date stay the same.`;
    if (!confirm(msg)) return;
  } else {
    if (!confirm(`Apply template "${tpl.name}" to this plan?`)) return;
  }

  // Deep-clone template phases/stages/items, regenerate IDs, reset live-mode fields
  const fresh = JSON.parse(JSON.stringify(tpl.phases));
  fresh.forEach(ph => {
    ph.id = ppUid('ph');
    ph.stages.forEach(st => {
      st.id = ppUid('st');
      st.items.forEach(it => {
        it.id = ppUid('it');
        it.status = 'to_do';
        it.assignedTo = null;
        it.dueDate = null;
        it.completedAt = null;
        it.completedBy = null;
        it.comment = null;
        if (it.subs) it.subs.forEach(s => {
          s.id = ppUid('sub');
          s.status = 'to_do';
          s.assignedTo = null;
          s.completedAt = null;
        });
      });
    });
  });

  // Replace contents in place — keep plan id, name, createdAt, archived
  plan.phases = fresh;
  plan.templateId = tpl.id;
  plan.updatedAt = ppToday();
  // Reset current phase to first phase of the new structure
  PP_CURRENT_PHASE_ID = plan.phases[0] ? plan.phases[0].id : null;

  ppSave();
  ppRender();
}

function ppDuplicatePlan() {
  const plan = ppCurrentPlan();
  if (!plan) return;
  const newName = prompt('Name for the duplicated plan:', plan.name + ' (copy)');
  if (!newName || !newName.trim()) return;
  const copy = JSON.parse(JSON.stringify(plan));
  copy.id = ppUid('pp');
  copy.name = newName.trim();
  copy.createdAt = ppToday();
  copy.archived = false;
  copy.phases.forEach(ph => {
    ph.id = ppUid('ph');
    ph.stages.forEach(st => {
      st.id = ppUid('st');
      st.items.forEach(it => {
        it.id = ppUid('it');
        if (it.subs) it.subs.forEach(s => s.id = ppUid('sub'));
      });
    });
  });
  PP_PLANS.push(copy);
  PP_CURRENT_PLAN_ID = copy.id;
  PP_CURRENT_PHASE_ID = copy.phases[0] ? copy.phases[0].id : null;
  ppSave();
  ppRender();
}

function ppRenamePlan() {
  const plan = ppCurrentPlan();
  if (!plan) return;
  const n = prompt('Rename plan:', plan.name);
  if (!n || !n.trim()) return;
  plan.name = n.trim();
  ppSave();
  ppRender();
}

function ppArchivePlan() {
  const plan = ppCurrentPlan();
  if (!plan) return;
  if (!confirm(`Archive plan "${plan.name}"?\n\nThe plan will be hidden from the list but retained for audit. Toggle "Show archived" to find it again.`)) return;
  plan.archived = true;
  plan.updatedAt = ppToday();
  ppSave();
  ppShowRegister();
}
function ppRestorePlan() {
  const plan = ppCurrentPlan();
  if (!plan || !plan.archived) return;
  plan.archived = false;
  plan.updatedAt = ppToday();
  ppSave();
  // Reflect change in topbar (toggle archive vs restore button)
  document.getElementById('pp-archive-btn').style.display = '';
  document.getElementById('pp-restore-btn').style.display = 'none';
  document.getElementById('pp-bc-curr').textContent = plan.name;
}
function ppToggleArchived() {
  PP_SHOW_ARCHIVED = !PP_SHOW_ARCHIVED;
  ppRender();
}

function ppSelectPhase(phaseId) {
  PP_CURRENT_PHASE_ID = phaseId;
  ppRender();
}

// ─── Stage / item editing ──────────────────────────────────
function ppToggleStage(stageId) {
  const items = document.getElementById('items-' + stageId);
  const chev = document.getElementById('chev-' + stageId);
  if (!items || !chev) return;
  const open = items.style.display !== 'none';
  items.style.display = open ? 'none' : 'block';
  chev.textContent = open ? '▸' : '▾';
}

function ppAddStage() {
  const phase = ppCurrentPhase();
  if (!phase) return;
  const name = prompt('Stage name:');
  if (!name || !name.trim()) return;
  phase.stages.push({ id: ppUid('st'), name: name.trim(), items: [] });
  ppSave(); ppRender();
}

function ppStageMenu(stageId, ev) {
  ppCloseAnyMenu();
  const phase = ppCurrentPhase();
  if (!phase) return;
  const stage = phase.stages.find(s => s.id === stageId);
  if (!stage) return;
  const menu = document.createElement('div');
  menu.className = 'pp-popmenu';
  menu.innerHTML = `
    <div class="pp-popitem" onclick="ppRenameStage('${stageId}')">Rename stage</div>
    <div class="pp-popitem" onclick="ppMoveStageUp('${stageId}')">Move up</div>
    <div class="pp-popitem" onclick="ppMoveStageDown('${stageId}')">Move down</div>
    <div class="pp-popitem pp-popitem-danger" onclick="ppDeleteStage('${stageId}')">Delete stage</div>`;
  document.body.appendChild(menu);
  ppPositionMenu(menu, ev);
}
function ppRenameStage(stageId) {
  ppCloseAnyMenu();
  const phase = ppCurrentPhase();
  const stage = phase.stages.find(s => s.id === stageId);
  if (!stage) return;
  const n = prompt('Rename stage:', stage.name);
  if (!n || !n.trim()) return;
  stage.name = n.trim();
  ppSave(); ppRender();
}
function ppMoveStageUp(stageId) {
  ppCloseAnyMenu();
  const phase = ppCurrentPhase();
  const i = phase.stages.findIndex(s => s.id === stageId);
  if (i > 0) { [phase.stages[i-1], phase.stages[i]] = [phase.stages[i], phase.stages[i-1]]; ppSave(); ppRender(); }
}
function ppMoveStageDown(stageId) {
  ppCloseAnyMenu();
  const phase = ppCurrentPhase();
  const i = phase.stages.findIndex(s => s.id === stageId);
  if (i >= 0 && i < phase.stages.length - 1) { [phase.stages[i], phase.stages[i+1]] = [phase.stages[i+1], phase.stages[i]]; ppSave(); ppRender(); }
}
function ppDeleteStage(stageId) {
  ppCloseAnyMenu();
  const phase = ppCurrentPhase();
  const stage = phase.stages.find(s => s.id === stageId);
  if (!stage) return;
  const msg = stage.items.length
    ? `Delete stage "${stage.name}" and its ${stage.items.length} item(s)?`
    : `Delete stage "${stage.name}"?`;
  if (!confirm(msg)) return;
  phase.stages = phase.stages.filter(s => s.id !== stageId);
  ppSave(); ppRender();
}

function ppAddItem(stageId) {
  const phase = ppCurrentPhase();
  if (!phase) return;
  const stage = phase.stages.find(s => s.id === stageId);
  if (!stage) return;
  stage.items.push({
    id: ppUid('it'),
    description: '',
    status: 'to_do',
    assignedTo: null,
    dueDate: null,
    link: null,
    notes: null,
    comment: null,
    completedAt: null,
    completedBy: null,
    subs: []
  });
  ppSave();
  ppRender();
  // Focus the new item's description input
  setTimeout(() => {
    const stageEl = document.querySelector('.pp-stage[data-stage="'+stageId+'"]');
    if (!stageEl) return;
    const inputs = stageEl.querySelectorAll('.pp-rows-tbl tbody tr:not(.pp-subitem-row) .pp-step-input');
    const last = inputs[inputs.length - 1];
    if (last) last.focus();
  }, 30);
}

// Inline-edit handlers for the new table layout
function ppUpdateItemDesc(itemId, val) {
  const r = ppFindItem(itemId);
  if (!r) return;
  r.item.description = val;
  ppSave();
}
function ppUpdateItemAssignee(itemId, val) {
  const r = ppFindItem(itemId);
  if (!r) return;
  r.item.assignedTo = val || null;
  ppSave();
  ppRender();
}
function ppUpdateSubAssignee(parentId, subId, val) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  r.sub.assignedTo = val || null;
  ppSave();
  ppRender();
}
function ppUpdateSubDesc(parentId, subId, val) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  r.sub.description = val;
  ppSave();
}
function ppSetSubStatus(parentId, subId, status) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  const cur = r.sub.status || 'to_do';
  const wasDone = cur === 'done';

  // Click the same button that's already active → deselect (back to 'to_do' / unset)
  if (cur === status) {
    r.sub.status = 'to_do';
    r.sub.completedAt = null;
  } else {
    r.sub.status = status;
    if (status === 'done' && !wasDone) {
      r.sub.completedAt = ppToday();
    } else {
      r.sub.completedAt = null;
    }
  }
  ppSave();
  ppRender();
}
function ppSetItemStatus(itemId, status) {
  const r = ppFindItem(itemId);
  if (!r) return;
  const cur = r.item.status || 'to_do';
  const wasDone = cur === 'done';

  // Click the same button that's already active → deselect (back to 'to_do' / unset)
  if (cur === status) {
    r.item.status = 'to_do';
    r.item.completedAt = null;
    r.item.completedBy = null;
  } else {
    r.item.status = status;
    if (status === 'done' && !wasDone) {
      r.item.completedAt = ppToday();
      r.item.completedBy = ppCurrentUserName();
    } else {
      r.item.completedAt = null;
      r.item.completedBy = null;
    }
  }
  ppSave();
  ppRender();
}

function ppToggleDone(itemId, checked) {
  const r = ppFindItem(itemId);
  if (!r) return;
  if (checked) {
    r.item.status = 'done';
    r.item.completedAt = ppToday();
    r.item.completedBy = ppCurrentUserName();
  } else {
    r.item.status = 'to_do';
    r.item.completedAt = null;
    r.item.completedBy = null;
  }
  ppSave(); ppRender();
}

function ppCycleStatus(itemId) {
  const r = ppFindItem(itemId);
  if (!r) return;
  const order = ['to_do', 'in_progress', 'done', 'not_required', 'blocked'];
  const i = order.indexOf(r.item.status || 'to_do');
  const next = order[(i + 1) % order.length];
  r.item.status = next;
  if (next === 'done') {
    r.item.completedAt = ppToday();
    r.item.completedBy = ppCurrentUserName();
  } else {
    r.item.completedAt = null;
    r.item.completedBy = null;
  }
  ppSave(); ppRender();
}

function ppItemMenu(itemId, ev) {
  ppCloseAnyMenu();
  const menu = document.createElement('div');
  menu.className = 'pp-popmenu';
  menu.innerHTML = `
    <div class="pp-popitem" onclick="ppOpenItem('${itemId}')">Edit details</div>
    <div class="pp-popitem" onclick="ppAddSubItem('${itemId}')">+ Add sub-item</div>
    <div class="pp-popitem" onclick="ppMoveItemUp('${itemId}')">Move up</div>
    <div class="pp-popitem" onclick="ppMoveItemDown('${itemId}')">Move down</div>
    <div class="pp-popitem pp-popitem-danger" onclick="ppDeleteItem('${itemId}')">Delete item</div>`;
  document.body.appendChild(menu);
  ppPositionMenu(menu, ev);
}

function ppMoveItemUp(itemId) {
  ppCloseAnyMenu();
  const r = ppFindItem(itemId);
  if (!r) return;
  const i = r.stage.items.findIndex(x => x.id === itemId);
  if (i > 0) { [r.stage.items[i-1], r.stage.items[i]] = [r.stage.items[i], r.stage.items[i-1]]; ppSave(); ppRender(); }
}
function ppMoveItemDown(itemId) {
  ppCloseAnyMenu();
  const r = ppFindItem(itemId);
  if (!r) return;
  const i = r.stage.items.findIndex(x => x.id === itemId);
  if (i >= 0 && i < r.stage.items.length - 1) { [r.stage.items[i], r.stage.items[i+1]] = [r.stage.items[i+1], r.stage.items[i]]; ppSave(); ppRender(); }
}
function ppDeleteItem(itemId) {
  ppCloseAnyMenu();
  const r = ppFindItem(itemId);
  if (!r) return;
  const subWarn = r.item.subs && r.item.subs.length ? ` and its ${r.item.subs.length} sub-item(s)` : '';
  if (!confirm(`Delete this item${subWarn}?`)) return;
  r.stage.items = r.stage.items.filter(x => x.id !== itemId);
  ppSave(); ppRender();
}

// ─── Sub-items ─────────────────────────────────────────────
function ppAddSubItem(parentId) {
  ppCloseAnyMenu();
  const r = ppFindItem(parentId);
  if (!r) return;
  const desc = prompt('Sub-item description:');
  if (!desc || !desc.trim()) return;
  if (!r.item.subs) r.item.subs = [];
  r.item.subs.push({ id: ppUid('sub'), description: desc.trim(), status: 'to_do', assignedTo: null, completedAt: null });
  ppSave(); ppRender();
}

function ppToggleSubDone(parentId, subId, checked) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  if (checked) {
    r.sub.status = 'done';
    r.sub.completedAt = ppToday();
  } else {
    r.sub.status = 'to_do';
    r.sub.completedAt = null;
  }
  ppSave(); ppRender();
}

function ppOpenSubItem(parentId, subId) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  const sub = r.sub;
  const userOpts = '<option value="">— Unassigned —</option>' +
    PP_USERS.map(u => '<option value="' + ppEsc(u.email || u.id) + '"' +
      ((sub.assignedTo === u.email || sub.assignedTo === u.id) ? ' selected' : '') + '>' +
      ppEsc(u.name || u.email) + '</option>').join('');

  document.getElementById('pp-modal-content').innerHTML = `
    <div class="pp-modal-hdr">
      <div style="font-size:11px;color:var(--muted)">Sub-item</div>
      <div style="font-size:16px;font-weight:600;margin-top:4px">Edit sub-item</div>
    </div>
    <div class="pp-modal-body">
      <label class="pp-lbl">Description</label>
      <textarea id="pp-sub-desc" class="pp-input" rows="2">${ppEsc(sub.description)}</textarea>
      <label class="pp-lbl">Assigned to</label>
      <select id="pp-sub-assignee" class="pp-input">${userOpts}</select>
    </div>
    <div class="pp-modal-ftr">
      <button class="btn" onclick="ppCloseModal()">Cancel</button>
      <button class="btn primary" onclick="ppSaveSubItem('${parentId}','${subId}')">Save</button>
    </div>`;
  document.getElementById('pp-modal').style.display = 'flex';
}

function ppSaveSubItem(parentId, subId) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  r.sub.description = document.getElementById('pp-sub-desc').value.trim();
  const a = document.getElementById('pp-sub-assignee');
  if (a) r.sub.assignedTo = a.value || null;
  ppCloseModal();
  ppSave(); ppRender();
}

function ppSubItemMenu(parentId, subId, ev) {
  ppCloseAnyMenu();
  const menu = document.createElement('div');
  menu.className = 'pp-popmenu';
  menu.innerHTML = `
    <div class="pp-popitem" onclick="ppOpenSubItem('${parentId}','${subId}')">Edit</div>
    <div class="pp-popitem pp-popitem-danger" onclick="ppDeleteSubItem('${parentId}','${subId}')">Delete</div>`;
  document.body.appendChild(menu);
  ppPositionMenu(menu, ev);
}

function ppDeleteSubItem(parentId, subId) {
  ppCloseAnyMenu();
  const r = ppFindItem(parentId);
  if (!r) return;
  if (!confirm('Delete this sub-item?')) return;
  r.item.subs = (r.item.subs || []).filter(s => s.id !== subId);
  ppSave(); ppRender();
}

// ─── Pop menu utils ────────────────────────────────────────
function ppPositionMenu(menu, ev) {
  const x = ev.clientX, y = ev.clientY;
  const w = 220, mh = 320;
  menu.style.left = Math.min(x, window.innerWidth - w - 10) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - mh) + 'px';
  setTimeout(() => document.addEventListener('click', ppCloseAnyMenu, { once: true }), 0);
}
function ppCloseAnyMenu() {
  document.querySelectorAll('.pp-popmenu').forEach(el => el.remove());
}

// ─── Item edit modal ───────────────────────────────────────
// ─── Notes drawer (item or sub-item) ────────────────────────
let PP_DRAWER_CTX = null;   // { kind: 'item'|'sub', itemId, subId? }

function ppOpenNotesDrawer(itemId) {
  const r = ppFindItem(itemId);
  if (!r) return;
  PP_DRAWER_CTX = { kind: 'item', itemId: itemId };
  document.getElementById('pp-drawer-title').textContent = 'Notes';
  document.getElementById('pp-drawer-context').textContent =
    r.phase.name + ' · ' + r.stage.name + ' · ' + (r.item.description || 'Untitled');
  const ta = document.getElementById('pp-drawer-notes');
  ta.value = r.item.notes || '';
  ppUpdateDrawerCharCount();
  ta.oninput = ppUpdateDrawerCharCount;
  document.getElementById('pp-drawer-overlay').classList.add('open');
  document.getElementById('pp-drawer').classList.add('open');
  setTimeout(() => ta.focus(), 240);
}

function ppOpenSubNotesDrawer(parentId, subId) {
  const r = ppFindSubItem(parentId, subId);
  if (!r) return;
  PP_DRAWER_CTX = { kind: 'sub', itemId: parentId, subId: subId };
  document.getElementById('pp-drawer-title').textContent = 'Sub-item Notes';
  document.getElementById('pp-drawer-context').textContent =
    r.phase.name + ' · ' + r.stage.name + ' · ' + (r.item.description || 'Item') + ' · ↳ ' + (r.sub.description || 'Sub-item');
  const ta = document.getElementById('pp-drawer-notes');
  ta.value = r.sub.notes || '';
  ppUpdateDrawerCharCount();
  ta.oninput = ppUpdateDrawerCharCount;
  document.getElementById('pp-drawer-overlay').classList.add('open');
  document.getElementById('pp-drawer').classList.add('open');
  setTimeout(() => ta.focus(), 240);
}

function ppUpdateDrawerCharCount() {
  const ta = document.getElementById('pp-drawer-notes');
  const cc = document.getElementById('pp-drawer-char-count');
  if (ta && cc) cc.textContent = (ta.value || '').length + ' chars';
}

function ppCloseDrawer() {
  document.getElementById('pp-drawer-overlay').classList.remove('open');
  document.getElementById('pp-drawer').classList.remove('open');
  PP_DRAWER_CTX = null;
}

function ppSaveDrawer() {
  const ctx = PP_DRAWER_CTX;
  if (!ctx) { ppCloseDrawer(); return; }
  const val = (document.getElementById('pp-drawer-notes').value || '').trim();
  if (ctx.kind === 'sub') {
    const r = ppFindSubItem(ctx.itemId, ctx.subId);
    if (r) r.sub.notes = val || null;
  } else {
    const r = ppFindItem(ctx.itemId);
    if (r) r.item.notes = val || null;
  }
  ppCloseDrawer();
  ppSave();
  ppRender();
}

// Legacy compatibility — old code paths
function ppCloseModal() { ppCloseDrawer(); }
function ppOpenItem(itemId) { ppOpenNotesDrawer(itemId); }
function ppOpenItemDrawer(itemId) { ppOpenNotesDrawer(itemId); }

// ─── Save ──────────────────────────────────────────────────
async function ppSave() {
  await dbSetProjectPlans(PP_PROJECT_NUM, PP_PLANS);
}

// ─── Excel export ──────────────────────────────────────────
function ppExportExcel() {
  const plan = ppCurrentPlan();
  if (!plan) return;
  if (typeof XLSX === 'undefined') { alert('XLSX library not loaded.'); return; }

  const wb = XLSX.utils.book_new();
  for (const phase of plan.phases) {
    const headers = ['Stage', 'Description', 'Status', 'Person responsible', 'Due date', 'Link', 'Comment', 'Sub-items'];
    const rows = [headers];
    for (const stage of phase.stages) {
      for (const item of stage.items) {
        const subList = (item.subs || []).map(s => '↳ ' + s.description).join('\n');
        rows.push([
          stage.name, item.description || '',
          (STATUS_LABELS[item.status] && STATUS_LABELS[item.status].label) || 'To do',
          ppLookupUserName(item.assignedTo),
          item.dueDate || '', item.link || '', item.comment || '', subList
        ]);
      }
    }
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:22},{wch:60},{wch:14},{wch:22},{wch:12},{wch:30},{wch:40},{wch:40}];
    const sname = phase.name.replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, sname);
  }
  const fname = (plan.name || 'project-plan').replace(/[^a-z0-9_-]+/gi, '_') + '_' + ppToday() + '.xlsx';
  XLSX.writeFile(wb, fname);
}

// ─── Excel import ──────────────────────────────────────────
function ppImportExcel() {
  const plan = ppCurrentPlan();
  if (!plan) { alert('No plan is open. Import from inside an open plan.'); return; }

  // Pre-confirm if there's content to overwrite
  const stats = ppPlanStats(plan);
  if (stats.total > 0) {
    const msg = `Importing will REPLACE this plan's contents.\n\n`
              + `All ${stats.total} item${stats.total===1?'':'s'} `
              + `(including ${stats.done} marked done) in "${plan.name}" will be deleted and replaced with rows from the Excel file.\n\n`
              + `The plan name and creation date stay the same. Continue?`;
    if (!confirm(msg)) return;
  }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.xlsm';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const tmp = ppPlanFromWorkbook(wb, plan.name);  // parse only; we'll merge phases
        // Replace current plan's phases in place
        plan.phases = tmp.phases;
        plan.updatedAt = ppToday();
        PP_CURRENT_PHASE_ID = plan.phases[0] ? plan.phases[0].id : null;
        ppSave();
        ppRender();
        alert(`Replaced contents of "${plan.name}" — ${ppPlanStats(plan).total} items imported.`);
      } catch(err) {
        console.error(err);
        alert('Import failed: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(f);
  };
  input.click();
}

function ppPlanFromWorkbook(wb, name) {
  const plan = { id: ppUid('pp'), name: name, templateId: null, createdAt: ppToday(), archived: false, phases: [] };

  const statusMap = {
    'done':'done','completed':'done','complete':'done',
    'not required':'not_required','n/a':'not_required','na':'not_required',
    'in progress':'in_progress','wip':'in_progress',
    'blocked':'blocked','on hold':'blocked',
    '':'to_do','to do':'to_do','todo':'to_do','pending':'to_do'
  };

  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    let hdrIdx = -1;
    for (let i = 0; i < Math.min(rows.length, 30); i++) {
      const lc = rows[i].map(c => String(c).toLowerCase().trim());
      if (lc.includes('stage') && (lc.includes('description') || lc.includes('item'))) { hdrIdx = i; break; }
    }
    if (hdrIdx < 0) continue;

    const hdr = rows[hdrIdx].map(c => String(c).toLowerCase().trim());
    const colStage  = hdr.indexOf('stage');
    const colDesc   = hdr.indexOf('description') >= 0 ? hdr.indexOf('description') : hdr.indexOf('item');
    const colStatus = hdr.indexOf('status');
    const colLink   = hdr.findIndex(c => c.includes('link') || c.includes('url'));

    const phase = { id: ppUid('ph'), name: sheetName, stages: [] };
    const stageMap = {};

    for (let i = hdrIdx + 1; i < rows.length; i++) {
      const r = rows[i];
      const stName = colStage >= 0 ? String(r[colStage] || '').trim() : '';
      const desc = colDesc >= 0 ? String(r[colDesc] || '').trim() : '';
      if (!desc) continue;
      const stKey = stName || '— Unstaged —';
      if (!stageMap[stKey]) {
        const s = { id: ppUid('st'), name: stKey, items: [] };
        stageMap[stKey] = s;
        phase.stages.push(s);
      }
      const stage = stageMap[stKey];

      const linkVal = colLink >= 0 ? String(r[colLink] || '').trim() : '';
      const rawStatus = colStatus >= 0 ? String(r[colStatus] || '').toLowerCase().trim() : '';
      stage.items.push({
        id: ppUid('it'),
        description: desc,
        status: statusMap[rawStatus] !== undefined ? statusMap[rawStatus] : 'to_do',
        assignedTo: null,
        dueDate: null,
        link: /^https?:\/\//i.test(linkVal) ? linkVal : null,
        comment: null,
        completedAt: null,
        completedBy: null,
        subs: []
      });
    }
    if (phase.stages.length) plan.phases.push(phase);
  }

  if (!plan.phases.length) throw new Error('No recognisable Stage/Description rows found in this workbook.');
  return plan;
}

// ─── Plan menu (project mode top-right ▾) ──────────────────
function ppPlanMenu(ev) {
  ev.stopPropagation();
  ppCloseAnyMenu();
  const plan = ppCurrentPlan();
  const archived = plan && plan.archived;

  const menu = document.createElement('div');
  menu.className = 'pp-popmenu';
  let html = '<div class="pp-popitem" onclick="ppNewPlan()">+ New plan</div>';
  if (PP_TEMPLATES.length) html += '<div class="pp-popitem" onclick="ppApplyTemplatePicker(event)">Apply template ▸</div>';
  html += `
    <div class="pp-popitem" ${plan ? '' : 'style="opacity:.4;pointer-events:none"'} onclick="ppDuplicatePlan()">Duplicate this plan</div>
    <div class="pp-popitem" ${plan ? '' : 'style="opacity:.4;pointer-events:none"'} onclick="ppRenamePlan()">Rename plan</div>
    <div class="pp-popitem" onclick="ppToggleArchived()">${PP_SHOW_ARCHIVED ? '✓ Showing archived' : 'Show archived'}</div>`;
  if (archived) {
    html += '<div class="pp-popitem" onclick="ppRestorePlan()">Restore from archive</div>';
  } else {
    html += `<div class="pp-popitem pp-popitem-danger" ${plan ? '' : 'style="opacity:.4;pointer-events:none"'} onclick="ppArchivePlan()">Archive plan</div>`;
  }
  menu.innerHTML = html;
  document.body.appendChild(menu);
  ppPositionMenu(menu, ev);
}

// ─── Boot ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ppInit);

// Esc-to-close drawer
window.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  const drawer = document.getElementById('pp-drawer');
  if (drawer && drawer.classList.contains('open')) {
    e.preventDefault();
    ppCloseDrawer();
  }
});
