<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Pre-Cx Templates — HVAC NEXUS</title>
<style>
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;min-height:100vh}

/* ── SIDEBAR STANDARD ── */
.sb{width:230px;position:fixed;top:0;left:0;bottom:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:300;transition:width .25s;overflow:hidden;overflow-x:hidden}
.sb.sm{width:52px}
.sb-top{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:9px;overflow:hidden}.sb-icon{font-size:20px;flex-shrink:0}.sb-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--text);white-space:nowrap}
.sb-toggle{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}.sb-toggle:hover{color:var(--accent);border-color:var(--accent)}
.sb-proj-block{padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}.sb-proj-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.sb-proj-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-proj-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:4px}.sb-nav::-webkit-scrollbar-track{background:transparent}.sb-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text2);font-size:13px;border-left:3px solid transparent;position:relative;overflow:hidden;text-decoration:none}.sb-item:hover{background:var(--surface2);color:var(--text)}.sb-item.active{background:var(--accent-dim);color:var(--accent);border-left-color:var(--accent)}
.sb-item-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}.sb-item-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sb-tooltip{position:fixed;background:var(--surface2);color:var(--text);font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.sb-group{}.sb-group-hdr{display:flex;align-items:center;gap:8px;padding:7px 16px 4px;cursor:pointer;user-select:none;transition:background .13s}.sb-group-hdr:hover{background:var(--surface2)}
.sb-group-chev{font-size:10px;color:var(--muted);flex-shrink:0;width:10px}.sb-group-name{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sb-group-items .sb-item{padding-left:28px}
.sb.sm .sb-name,.sb.sm .sb-proj-block,.sb.sm .sb-group-hdr,.sb.sm .sb-item-label,.sb.sm .sb-user-name{display:none}
.sb.sm .sb-group-items{display:block !important}.sb.sm .sb-item{padding:9px 14px;justify-content:center;border-left:none;overflow:visible}
.sb.sm .sb-top{padding:14px 12px 10px;justify-content:center}.sb.sm .sb-footer{justify-content:center}.sb.sm .sb-item-icon{width:auto}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:9px}
.sb-av{width:28px;height:28px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px}.sb-user-name{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-resize-handle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:400;background:transparent}.sb-resize-handle:hover{background:rgba(0,200,255,.15)}

/* MAIN */
.main{margin-left:230px;transition:margin-left .25s}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.bc{display:flex;align-items:center;gap:7px;font-size:13px}
.bcl{color:var(--text2);cursor:pointer}.bcl:hover{color:var(--accent)}.bcs{color:var(--muted)}.bcc{color:var(--text);font-weight:500}
.btn{padding:7px 15px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.bp{background:var(--accent);color:#080c12;font-weight:600}.bp:hover{background:#33d4ff}
.bg{background:transparent;color:var(--text2);border:1px solid var(--border)}.bg:hover{color:var(--text);border-color:var(--muted);background:var(--surface2)}
.bsm{padding:5px 12px;font-size:12px}

/* TOOLBAR + REGISTER */
.reg-toolbar{padding:12px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface3);border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;width:280px}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:100%}
.reg-page{padding:16px 24px 60px}
.reg-tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.reg-tbl thead tr{background:var(--surface2)}
.reg-tbl th{padding:9px 14px;text-align:left;font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.reg-tbl td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.reg-tbl tbody tr:last-child td{border-bottom:none}
.reg-tbl tbody tr:hover td{background:var(--surface2)}
.tpl-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);font-weight:700}
.tpl-name{font-weight:600;color:var(--text)}
.tpl-ver{font-family:'DM Mono',monospace;font-size:11px;padding:2px 8px;border-radius:4px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.status-badge{font-family:'DM Mono',monospace;font-size:10px;padding:2px 9px;border-radius:20px;white-space:nowrap}
.sb-current{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,229,160,.2)}
.sb-draft{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(255,184,48,.2)}
.sb-empty{background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.imported-badge{font-family:'DM Mono',monospace;font-size:9px;padding:1px 7px;border-radius:5px;background:var(--purple-dim,rgba(167,139,250,.15));border:1px solid rgba(167,139,250,.25);color:var(--purple,#c4b5fd);margin-left:6px;vertical-align:middle}

/* Action icon buttons */
.act-btns-grid{display:grid;grid-template-columns:repeat(4,28px);gap:4px;justify-content:flex-end}
.act-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .13s;position:relative}
.act-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.act-btn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-dim)}
.act-btn.warn:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-dim)}
.act-btn .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:500}
.act-btn:hover .tip{opacity:1}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:16px;color:var(--muted)}
.empty-icon{font-size:42px;opacity:.6}
.empty-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text2)}
.empty-sub{font-size:13px;color:var(--muted);text-align:center;max-width:380px;line-height:1.6}

/* VIEWS */
.view{display:none}.view.active{display:block}

/* EDITOR */
.editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);background:var(--surface);gap:10px}
.editor-body{padding:20px 24px 60px;display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto}

/* META */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meta-grid-full{grid-column:1/-1}
.field-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.field-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s;box-sizing:border-box}
.field-input:focus{border-color:var(--accent)}
.field-textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;resize:vertical;min-height:60px;box-sizing:border-box}
.field-textarea:focus{border-color:var(--accent)}
.field-select{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer;box-sizing:border-box}

/* INFO BANNER */
.info-banner{padding:11px 14px;background:var(--accent-dim);border:1px solid rgba(0,200,255,.25);border-radius:8px;color:var(--text2);font-size:12.5px;display:flex;align-items:center;gap:10px}
.info-banner-icon{font-size:16px;flex-shrink:0}

/* SECTIONS (editor) */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section-card-hdr{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-card-hdr .field-input{flex:1;background:var(--surface);font-weight:600}
.section-card-hdr .field-select{width:200px;flex-shrink:0;background:var(--surface)}
.section-card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item-row{display:flex;align-items:center;gap:8px;border-radius:6px;padding:2px 0;transition:background .13s}
.item-row .field-input{flex:1}
.item-drag-handle{cursor:grab;color:var(--muted);font-size:13px;padding:0 5px;flex-shrink:0;user-select:none;opacity:.5;transition:opacity .13s}
.item-drag-handle:hover{opacity:1;color:var(--accent)}
.item-drag-handle:active{cursor:grabbing}
.item-row.dragging{opacity:.4}
.item-row.drag-over{background:var(--accent-dim);box-shadow:inset 0 2px 0 var(--accent)}
.act-btn-edit{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;cursor:pointer;transition:all .13s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.act-btn-edit:hover{color:var(--accent);border-color:var(--accent)}
.act-btn-edit.danger:hover{color:var(--danger);border-color:var(--danger)}
.act-btn-edit:disabled{opacity:.3;cursor:not-allowed}
.act-btn-edit:disabled:hover{color:var(--text2);border-color:var(--border)}
.section-meta{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.add-item-btn{align-self:flex-start;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:11.5px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .13s;margin-top:4px}
.add-item-btn:hover{color:var(--accent);border-color:var(--accent)}
.add-section-btn{padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--muted);font-family:'DM Mono',monospace;font-size:11.5px;cursor:pointer;text-align:center;transition:all .13s;background:transparent}
.add-section-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.drag-handle{cursor:grab;color:var(--muted);font-size:14px;padding:0 4px;flex-shrink:0;user-select:none}
.drag-handle:active{cursor:grabbing}
.section-card.dragging{opacity:.4}
.section-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* SAVE STATUS */
.save-pill{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.save-pill.dirty{color:var(--warn);border-color:rgba(255,184,48,.3);background:var(--warn-dim)}
.save-pill.saved{color:var(--green);border-color:rgba(0,229,160,.3);background:var(--green-dim)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(4,8,16,.8);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mo.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;width:520px;max-width:96vw;max-height:90vh}
</style>

<body>

<!-- SIDEBAR -->

<!-- MAIN -->
<div class="main" id="mainWrap">

      <button class="bp bsm btn" id="saveBtn" style="display:none" onclick="saveTemplate()">💾 Save</button>

<script>
// ── DATA ──
var template=null;
var _dirty=false;
var proj={};
var pNum='';
var currentView='register';

function nid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d.getTime()))return '—';
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}
function templateHasContent(t){
  return t && Array.isArray(t.sections);
}

// ── BOOT ──
(async function(){
  if(typeof dbReady!=='undefined')await dbReady;
  try{proj=JSON.parse(localStorage.getItem('hvacnexus_current_project')||'{}');}catch(e){proj={};}
  pNum=proj.num||'';
  // Populate project name in breadcrumb
  var _pn=document.getElementById('bcProjName');
  if(_pn)_pn.textContent=(proj.name||proj.num||'Project');
  if(!pNum){
    document.getElementById('regBody').innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">No project selected</div><div class="empty-sub">Pick a project from the dashboard, then return here.</div></div></td></tr>';
    document.getElementById('pullBtn').disabled=true;
    return;
  }
  await loadTemplate();
  renderRegister();
})();

function bcProjClick(){
  var pid=(proj&&(proj.id||proj.num))||'';
  if(pid)navTo('project.html?id='+encodeURIComponent(pid));
  else navTo('index.html');
}

async function loadTemplate(){
  try{
    var t=await dbGetProjectPrecxTemplate(pNum);
    template=templateHasContent(t)?t:null;
  }catch(e){console.error(e);template=null;}
}

// ── REGISTER VIEW ──
function renderRegister(){
  var body=document.getElementById('regBody');
  var countEl=document.getElementById('tplCount');
  var srch=(document.getElementById('srch').value||'').toLowerCase();

  if(!template){
    body.innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No project template yet</div><div class="empty-sub">Import a template from the company library to get started. You\'ll be able to edit the project copy without affecting the master.</div></div></td></tr>';
    countEl.textContent='0 templates';
    return;
  }

  var name=(template.name||'Untitled').toLowerCase();
  if(srch && name.indexOf(srch)<0){
    body.innerHTML='<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted);font-size:12.5px">No templates match the search.</td></tr>';
    countEl.textContent='0 of 1 templates';
    return;
  }

  var sections=(template.sections||[]).length;
  var items=(template.sections||[]).reduce(function(n,s){return n+(s.items||[]).length;},0);
  var status=sections>0?'<span class="status-badge sb-current">Current</span>':'<span class="status-badge sb-empty">Empty</span>';
  var importedBadge=template.pulledFrom?'<span class="imported-badge">imported</span>':'';
  var formNo='PRECX-001';

  var row='<tr style="cursor:pointer" onclick="openEditor()">'
    +'<td><span class="tpl-num">'+formNo+'</span></td>'
    +'<td><span class="tpl-name">'+escH(template.name||'Untitled')+'</span>'+importedBadge+'<div style="font-size:11px;color:var(--muted);margin-top:3px;font-family:DM Mono,monospace">'+sections+' section'+(sections!==1?'s':'')+' · '+items+' item'+(items!==1?'s':'')+'</div></td>'
    +'<td><span class="tpl-ver">v1</span></td>'
    +'<td>'+status+'</td>'
    +'<td style="color:var(--text2);font-size:12px">'+fmtDate(template.savedAt)+'</td>'
    +'<td onclick="event.stopPropagation()">'
      +'<div class="act-btns-grid">'
        +'<button class="act-btn" onclick="openEditor()" title="Edit"><span class="tip">Edit</span>✏️</button>'
        +'<button class="act-btn" onclick="exportPDF()" title="Export PDF"><span class="tip">Export PDF</span>📄</button>'
        +'<button class="act-btn" onclick="openRevHist()" title="Revision history"><span class="tip">Revision history</span>🕐</button>'
        +'<button class="act-btn danger" onclick="deleteTemplate()" title="Delete"><span class="tip">Delete</span>🗑</button>'
      +'</div>'
    +'</td>'
  +'</tr>';
  body.innerHTML=row;
  countEl.textContent='1 template';
}

// ── VIEW SWITCHING ──
function showRegister(){
  if(_dirty&&!confirm('Discard unsaved changes?'))return;
  _dirty=false;
  currentView='register';
  document.getElementById('view-register').classList.add('active');
  document.getElementById('view-editor').classList.remove('active');
  document.getElementById('backToRegBtn').style.display='none';
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('saveStatus').style.display='none';
  document.getElementById('pullBtn').style.display='';
  document.getElementById('bcCurr').textContent='Pre-Commissioning Templates';
  renderRegister();
}
function openEditor(){
  if(!template)return;
  currentView='editor';
  document.getElementById('view-register').classList.remove('active');
  document.getElementById('view-editor').classList.add('active');
  document.getElementById('backToRegBtn').style.display='';
  document.getElementById('saveBtn').style.display='';
  document.getElementById('saveStatus').style.display='';
  document.getElementById('pullBtn').style.display='none';
  document.getElementById('bcCurr').textContent=(template.name||'Untitled');
  renderEditor();
  updateSaveStatus();
}

// ── EDITOR ──
function renderEditor(){
  if(!template)return;
  document.getElementById('editorTitle').textContent=template.name||'Untitled';
  var body=document.getElementById('editorBody');
  var html='';

  if(template.pulledFrom){
    html+='<div class="info-banner">'
      +'<span class="info-banner-icon">ℹ️</span>'
      +'<span>Imported from company template. Edits here only affect this project.</span>'
    +'</div>';
  }

  html+='<div class="meta-grid">'
    +'<div class="meta-grid-full">'
      +'<label class="field-lbl">Template name (project copy)</label>'
      +'<input class="field-input" id="meta-name" value="'+escH(template.name||'')+'" oninput="updateMeta(\'name\',this.value)">'
    +'</div>'
    +'<div class="meta-grid-full">'
      +'<label class="field-lbl">Description (optional)</label>'
      +'<textarea class="field-textarea" id="meta-desc" oninput="updateMeta(\'description\',this.value)" placeholder="Project-specific notes for this checklist">'+escH(template.description||'')+'</textarea>'
    +'</div>'
  +'</div>';

  html+='<div style="display:flex;flex-direction:column;gap:14px" id="sectionsList">';
  (template.sections||[]).forEach(function(sec,sIdx){
    html+=renderSectionCard(sec,sIdx,(template.sections||[]).length);
  });
  html+='</div>';

  html+='<button class="add-section-btn" onclick="addSection()">＋ Add Section</button>';

  body.innerHTML=html;
}

function renderSectionCard(sec,sIdx,total){
  var html='<div class="section-card" data-sec-id="'+sec.id+'" '
    +'ondragstart="secDragStart(event,\''+sec.id+'\')" '
    +'ondragend="secDragEnd(event)" '
    +'ondragover="secDragOver(event)" '
    +'ondragleave="secDragLeave(event)" '
    +'ondrop="secDrop(event,\''+sec.id+'\')">'
    +'<div class="section-card-hdr">'
      +'<span class="drag-handle" title="Drag to reorder" '
        +'onmousedown="this.closest(\'.section-card\').setAttribute(\'draggable\',\'true\')" '
        +'onmouseup="this.closest(\'.section-card\').setAttribute(\'draggable\',\'false\')">⋮⋮</span>'
      +'<input class="field-input" placeholder="Section title (e.g. General / Documentation)" value="'+escH(sec.title||'')+'" oninput="updateSection(\''+sec.id+'\',\'title\',this.value)">'
      +'<div class="section-meta">'
        +'<button class="act-btn-edit" '+(sIdx===0?'disabled':'')+' onclick="moveSection(\''+sec.id+'\',-1)" title="Move up">↑</button>'
        +'<button class="act-btn-edit" '+(sIdx===total-1?'disabled':'')+' onclick="moveSection(\''+sec.id+'\',1)" title="Move down">↓</button>'
        +'<button class="act-btn-edit danger" onclick="deleteSection(\''+sec.id+'\')" title="Delete section">✕</button>'
      +'</div>'
    +'</div>'
    +'<div class="section-card-body">';
  (sec.items||[]).forEach(function(it){
    html+='<div class="item-row" data-item-id="'+it.id+'" data-sec-id="'+sec.id+'" '
      +'ondragstart="itemDragStart(event,\''+sec.id+'\',\''+it.id+'\')" '
      +'ondragend="itemDragEnd(event)" '
      +'ondragover="itemDragOver(event)" '
      +'ondragleave="itemDragLeave(event)" '
      +'ondrop="itemDrop(event,\''+sec.id+'\',\''+it.id+'\')">'
      +'<span class="item-drag-handle" title="Drag to reorder" '
        +'onmousedown="this.closest(\'.item-row\').setAttribute(\'draggable\',\'true\')" '
        +'onmouseup="this.closest(\'.item-row\').setAttribute(\'draggable\',\'false\')">⋮⋮</span>'
      +'<input class="field-input" placeholder="Check item description" value="'+escH(it.desc||'')+'" oninput="updateItem(\''+sec.id+'\',\''+it.id+'\',this.value)">'
      +'<button class="act-btn-edit danger" onclick="deleteItem(\''+sec.id+'\',\''+it.id+'\')" title="Delete item">✕</button>'
    +'</div>';
  });
  html+='<button class="add-item-btn" onclick="addItem(\''+sec.id+'\')">＋ Add Item</button>'
    +'</div>'
  +'</div>';
  return html;
}

// ── EDITS ──
function markDirty(){_dirty=true;updateSaveStatus();}
function updateMeta(field,val){
  if(!template)return;
  template[field]=val;
  if(field==='name')document.getElementById('editorTitle').textContent=val||'Untitled';
  markDirty();
}
function addSection(){
  if(!template)return;
  if(!template.sections)template.sections=[];
  template.sections.push({id:nid(),title:'',items:[]});
  markDirty();renderEditor();
}
function updateSection(secId,field,val){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(s){s[field]=val;markDirty();}
}
function deleteSection(secId){
  if(!template)return;
  if(!confirm('Delete this section and all its items?'))return;
  template.sections=(template.sections||[]).filter(function(s){return s.id!==secId;});
  markDirty();renderEditor();
}
function moveSection(secId,delta){
  if(!template||!template.sections)return;
  var i=template.sections.findIndex(function(s){return s.id===secId;});
  if(i<0)return;
  var j=i+delta;
  if(j<0||j>=template.sections.length)return;
  var tmp=template.sections[i];template.sections[i]=template.sections[j];template.sections[j]=tmp;
  markDirty();renderEditor();
}
function addItem(secId){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(!s)return;
  if(!s.items)s.items=[];
  s.items.push({id:nid(),desc:''});
  markDirty();renderEditor();
}
function updateItem(secId,itId,val){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(!s)return;
  var it=(s.items||[]).find(function(x){return x.id===itId;});
  if(it){it.desc=val;markDirty();}
}
function deleteItem(secId,itId){
  if(!template)return;
  var s=(template.sections||[]).find(function(x){return x.id===secId;});
  if(!s)return;
  s.items=(s.items||[]).filter(function(x){return x.id!==itId;});
  markDirty();renderEditor();
}

// ── DRAG & DROP ──
var _dragSecId=null;
function secDragStart(e,id){_dragSecId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function secDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  e.currentTarget.setAttribute('draggable','false');
  document.querySelectorAll('.section-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});
  _dragSecId=null;
}
function secDragOver(e){if(!_dragSecId)return;e.preventDefault();e.currentTarget.classList.add('drag-over');e.dataTransfer.dropEffect='move';}
function secDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function secDrop(e,targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!_dragSecId||_dragSecId===targetId)return;
  if(!template||!template.sections)return;
  var fromIdx=template.sections.findIndex(function(s){return s.id===_dragSecId;});
  var toIdx=template.sections.findIndex(function(s){return s.id===targetId;});
  if(fromIdx<0||toIdx<0)return;
  var moved=template.sections.splice(fromIdx,1)[0];
  template.sections.splice(toIdx,0,moved);
  _dragSecId=null;
  markDirty();renderEditor();
}

// Item-row drag (within same section only)
var _dragItemId=null,_dragItemSecId=null;
function itemDragStart(e,secId,itemId){
  _dragItemSecId=secId;_dragItemId=itemId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.stopPropagation();
}
function itemDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  e.currentTarget.setAttribute('draggable','false');
  document.querySelectorAll('.item-row.drag-over').forEach(function(el){el.classList.remove('drag-over');});
  _dragItemId=null;_dragItemSecId=null;
}
function itemDragOver(e){
  if(!_dragItemId)return;
  var thisSecId=e.currentTarget.getAttribute('data-sec-id');
  if(thisSecId!==_dragItemSecId)return;
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.add('drag-over');
  e.dataTransfer.dropEffect='move';
}
function itemDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function itemDrop(e,targetSecId,targetItemId){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if(!_dragItemId||_dragItemId===targetItemId)return;
  if(_dragItemSecId!==targetSecId)return;
  if(!template||!template.sections)return;
  var sec=template.sections.find(function(s){return s.id===targetSecId;});
  if(!sec||!Array.isArray(sec.items))return;
  var fromIdx=sec.items.findIndex(function(it){return it.id===_dragItemId;});
  var toIdx=sec.items.findIndex(function(it){return it.id===targetItemId;});
  if(fromIdx<0||toIdx<0)return;
  var moved=sec.items.splice(fromIdx,1)[0];
  sec.items.splice(toIdx,0,moved);
  _dragItemId=null;_dragItemSecId=null;
  markDirty();renderEditor();
}

// ── SAVE ──
async function saveTemplate(){
  if(!template)return;
  if(!(template.name||'').trim()){alert('Please give the template a name before saving.');return;}
  template.savedAt=nowISO();
  await dbSetProjectPrecxTemplate(pNum,template);
  _dirty=false;
  updateSaveStatus();
  showToast('✓ Project template saved');
}

function updateSaveStatus(){
  var el=document.getElementById('saveStatus');
  if(!el)return;
  if(!template){el.textContent='No template';el.className='save-pill';return;}
  if(_dirty){el.textContent='● Unsaved changes';el.className='save-pill dirty';}
  else{el.textContent='✓ All changes saved';el.className='save-pill saved';}
}

// ── PICKER MODAL ──
async function openPickerModal(){
  document.getElementById('pickerModal').classList.add('open');
  var listEl=document.getElementById('pickerList');
  listEl.innerHTML='<div style="color:var(--muted);font-size:13px">Loading…</div>';
  var lib=[];
  try{lib=await dbGetPrecxTemplateLibrary();}catch(e){console.error(e);}
  if(!Array.isArray(lib))lib=[];
  if(!lib.length){
    listEl.innerHTML='<div style="color:var(--muted);font-size:13px;padding:20px;text-align:center">No templates in the company library yet. <a href="precx-templates.html" style="color:var(--accent);text-decoration:none">Open the Pre-Cx Builder</a> to create one.</div>';
    return;
  }
  listEl.innerHTML=lib.map(function(tpl){
    var c={secs:(tpl.sections||[]).length,items:(tpl.sections||[]).reduce(function(n,s){return n+(s.items||[]).length;},0)};
    return '<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;cursor:pointer;transition:all .13s" '+
      'onmouseover="this.style.borderColor=\'var(--accent)\';this.style.background=\'var(--accent-dim)\'" '+
      'onmouseout="this.style.borderColor=\'var(--border)\';this.style.background=\'transparent\'" '+
      'onclick="pullFromLibrary(\''+escH(tpl.id||'')+'\')">'+
      '<div style="font-family:\'Syne\',sans-serif;font-size:13px;font-weight:700">'+escH(tpl.name||'Untitled')+'</div>'+
      (tpl.description?'<div style="font-size:11.5px;color:var(--text2);margin-top:3px">'+escH(tpl.description)+'</div>':'')+
      '<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--muted);margin-top:5px">'+c.secs+' section'+(c.secs!==1?'s':'')+' · '+c.items+' item'+(c.items!==1?'s':'')+'</div>'+
    '</div>';
  }).join('');
}
function closePickerModal(){document.getElementById('pickerModal').classList.remove('open');}

async function pullFromLibrary(tplId){
  if(template){
    if(!confirm('Replace the current project template? Edits to the existing project template will be lost.'))return;
  }
  var lib=[];
  try{lib=await dbGetPrecxTemplateLibrary();}catch(e){console.error(e);}
  var src=(Array.isArray(lib)?lib:[]).find(function(t){return t.id===tplId;});
  if(!src){alert('Template not found.');return;}
  // Deep copy with regenerated internal IDs so edits never bleed back to the company library
  var copy=JSON.parse(JSON.stringify(src));
  copy.pulledFrom=src.name||'Untitled';
  copy.pulledFromId=src.id;
  copy.pulledAt=nowISO();
  copy.savedAt=nowISO();
  (copy.sections||[]).forEach(function(s){
    s.id=nid();
    (s.items||[]).forEach(function(it){it.id=nid();});
  });
  await dbSetProjectPrecxTemplate(pNum,copy);
  template=copy;
  closePickerModal();
  renderRegister();
  showToast('✓ Template imported — open Edit to customise');
}

// ── EXPORT PDF (stub for now) ──
function exportPDF(){
  showToast('PDF export — coming soon');
}

// ── REVISION HISTORY (stub for now) ──
function openRevHist(){
  showToast('Revision history — coming soon');
}

// ── DELETE ──
async function deleteTemplate(){
  if(!template)return;
  if(!confirm('Delete this project template? This cannot be undone. The company library copy is not affected.'))return;
  await dbSetProjectPrecxTemplate(pNum,{});
  template=null;
  showRegister();
  showToast('✓ Project template deleted');
}

// ── WARN ON LEAVE ──
window.addEventListener('beforeunload',function(e){
  if(_dirty){e.preventDefault();e.returnValue='';return '';}
});

// ── ESCAPE TO CLOSE MODAL ──
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closePickerModal();
});

// ── TOAST ──
function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0e1520;border:1px solid #00e5a0;color:#00e5a0;font-family:DM Mono,monospace;font-size:12px;padding:10px 20px;border-radius:8px;z-index:9999;white-space:nowrap;pointer-events:none';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(function(){t.remove();},400);},2200);
}
</script>
